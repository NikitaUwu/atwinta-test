/* БЭКС ERP · тема VerdaAgro. Подключается после redesign.css и переопределяет только внешний вид: разметка, классы и поведение не меняются. */
:root{
  --bg:#fff;--ink:#2b3318;--muted:#5e6550;--line:#e6e8dc;--line-strong:#d4d8c4;--surface:#fff;
  --accent:#4f5a2f;--olive-500:#6b7842;--olive-50:#f4f6ec;--sage-200:#d9dec3;--gold:#e6c14a;--gold-soft:#fbf3d2;
  --success:#3a8227;--warn:#e6c14a;--danger:#b3362b;
  --blue-soft:rgba(79,90,47,.1);--green-soft:#e4f1d7;--amber-soft:#fbf3d2;--red-soft:rgba(179,54,43,.1);
  --glass:rgba(255,255,255,.62);--shadow-sm:0 2px 8px rgba(43,51,24,.08);--shadow-lg:0 24px 56px rgba(43,51,24,.12)
}
body{background:#fff;color:var(--ink);font:15px/1.5 Onest,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid rgba(79,90,47,.4);outline-offset:3px}

/* Кнопки и поля: пилюли и мягкие радиусы */
button{border-radius:999px;border-color:var(--line-strong);min-height:44px;padding:0 22px;font-weight:500;transition:background .15s,border-color .15s}
button:hover{background:rgba(79,90,47,.06);border-color:var(--accent)}
.primary{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500}
.primary:hover{background:var(--gold);border-color:var(--gold);filter:brightness(.96)}
input,select,textarea{border-color:var(--line-strong);border-radius:16px;min-height:48px;padding:0 18px}
textarea{padding:14px 18px;border-radius:20px}
input[type=checkbox]{border-radius:6px;accent-color:var(--accent)}
.small{min-height:40px;font-size:14px;padding:0 20px}
.subtle{background:transparent;border-color:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:4px;font-size:15px}
.subtle:hover{background:transparent;border-color:transparent}
.icon-button{padding:0;width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.link{border-radius:0;min-height:24px;padding:0}
.link:hover{background:transparent;border-color:transparent;color:var(--accent)}
.move-btn{border-radius:999px;width:36px;height:36px;min-height:36px;justify-content:center;background:rgba(79,90,47,.08);color:var(--accent)}
.move-btn:hover{background:rgba(79,90,47,.16)}

/* Типографика: легкие крупные заголовки */
h1{font-size:56px;line-height:60px;letter-spacing:-.04em;font-weight:300;margin:12px 0 14px}
h2{font-size:24px;line-height:32px;letter-spacing:-.01em;font-weight:400;margin-bottom:16px}
h3{font-size:16px;line-height:24px;font-weight:500}
.muted,.section-caption{font-size:14px;line-height:20px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive-500);font-weight:500}
.card-top .eyebrow,.route-name .eyebrow{font-size:13px;letter-spacing:0;text-transform:none}
.card-top .eyebrow{color:var(--muted);font-weight:400}
.route-name .eyebrow{font-weight:500}

/* Оболочка: меню */
.layout{grid-template-columns:280px minmax(0,1fr)}
.sidebar{padding:0 20px 24px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.brand{height:auto;padding:28px 8px 20px;margin-bottom:8px;gap:14px}
.brand-symbol{width:44px;height:44px;border-radius:14px;background:var(--accent);font-size:20px}
.brand b{font-size:18px;letter-spacing:-.01em;font-weight:500}
.brand small{font-size:12px;color:var(--muted);line-height:16px}
.nav-group{margin-bottom:4px}
.nav-group summary{height:40px;padding:0 16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--olive-500);align-items:center}
.nav-group summary:hover{color:var(--accent)}
.nav-group summary:after{font-size:16px;color:var(--olive-500)}
.nav{gap:2px;padding-bottom:8px}
.nav button{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;color:var(--ink);font-weight:400}
.nav button:hover{background:rgba(79,90,47,.06);border:0}
.nav button.active{background:rgba(79,90,47,.1);color:var(--ink);font-weight:500}
.nav button.active:after{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold)}
.sidefoot{margin:auto 0 0;padding:16px 18px;border:0;border-radius:20px;background:var(--olive-50);font-size:12px;line-height:18px;color:var(--ink);font-weight:500}
.sidefoot span{font-weight:400;color:var(--muted);margin-top:2px}

/* Оболочка: верхняя панель и рабочая область */
.top{height:72px;padding:0 40px;font-size:14px;gap:16px;border-bottom:1px solid var(--line)}
.top b{font-weight:500}
.mark{font-size:13px;line-height:20px;padding:6px 14px;border-radius:999px;background:var(--gold-soft);color:#5a4500;font-weight:500}
.workspace{padding:48px 40px 32px}
.page-heading{align-items:flex-end;margin-bottom:32px}
.page-heading p{font-size:18px;line-height:28px;color:var(--muted)}
.actions{gap:12px}
.page-heading .primary,.actions .primary{min-height:52px;padding:0 28px;font-size:16px}
.workspace-tools{gap:12px;margin-bottom:32px}
.searchbox{background:#fff;border-color:var(--line-strong);border-radius:999px;min-height:52px;padding:0 20px;min-width:300px}
.searchbox input{border:0;min-height:0;padding:0;border-radius:0;width:260px;font-size:15px}
.date-tools{gap:8px}
.date-tools input{width:170px;border-radius:999px;min-height:52px;font-weight:500}
.date-tools select{width:130px;border-radius:999px;min-height:52px}
.date-tools .icon-button{width:52px;min-height:52px}
.footer{font-size:13px;color:var(--muted);text-align:center;border-top:0;margin-top:56px}

/* Переключатели и фильтры */
.viewbar{gap:16px;margin-bottom:24px}
.segmented{background:rgba(79,90,47,.08);padding:4px;border-radius:999px;gap:4px}
.segmented button{min-height:40px;padding:0 22px;font-size:14px;color:var(--muted);background:transparent;border:0}
.segmented button:hover{background:transparent;color:var(--ink)}
.segmented .selected{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);font-weight:500}
.filterchips{gap:8px}
.filterchips button{border:1px solid var(--line-strong);background:#fff;min-height:44px;padding:0 20px;font-size:14px;color:var(--ink)}
.filterchips button:hover{border-color:var(--accent);background:rgba(79,90,47,.05)}
.filterchips .selected{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.drag-help{font-size:14px;margin-bottom:24px}

/* Показатели */
.kpi-row{border:0;background:transparent;gap:16px;margin-bottom:40px}
.kpi{border:1px solid var(--line);border-radius:28px;padding:24px 28px;background:#fff}
.kpi:first-child{background:var(--olive-50);border-color:var(--olive-50)}
.kpi:last-child{border:1px solid var(--line)}
.kpi>span{font-size:14px;line-height:20px}
.kpi strong{font-size:48px;line-height:52px;letter-spacing:-.04em;font-weight:300;margin:6px 0}
.kpi small{font-size:14px;color:var(--muted)}
.metrics{border-radius:28px;background:var(--olive-50);padding:24px 28px;gap:24px}
.metrics small{font-size:14px}
.metrics strong{font-size:36px;line-height:40px;font-weight:300;letter-spacing:-.03em}

/* Заголовки секций */
.section-title h2,.section-title h3{font-size:24px;line-height:32px;font-weight:400;letter-spacing:-.01em}
.section-title.secondary{border-top:1px solid var(--line);padding-top:28px;margin-top:40px}
.count{background:rgba(79,90,47,.1);border:0;color:var(--accent);border-radius:999px;font-size:14px;font-weight:500;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}

/* Карточки */
.cargo-card,.order-tile,.job-tile{border-radius:20px;padding:20px;margin-bottom:14px;border-color:var(--line);background:#fff}
.cargo-card:hover,.order-tile:hover,.job-tile:hover{border-color:var(--olive-500);box-shadow:var(--shadow-sm)}
.card-top{margin-bottom:10px}
.cargo-card>.link,.order-tile>.link,.job-tile>.link{font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
.cargo-card>p,.order-tile>p{font-size:14px;line-height:20px;margin:4px 0 16px}
.card-bottom{gap:8px}
.card-bottom b{font-size:22px;line-height:28px;font-weight:400;letter-spacing:-.02em}
.cargo-card .card-bottom b{font-size:28px;line-height:32px;font-weight:300;letter-spacing:-.03em}
.card-meta{font-size:13px;line-height:18px;margin-top:14px}
.card-alert{font-size:13px;line-height:18px;padding-top:12px;margin-top:12px;border-top-color:#eef0e4}
.card-alert:before{color:var(--gold)}
.badge{border-radius:999px;padding:5px 12px;font-size:13px;line-height:18px;font-weight:500;background:rgba(79,90,47,.08);color:var(--accent)}
.badge.good{background:var(--green-soft);color:#2d6a1b}
.badge.warn{background:var(--gold-soft);color:#5a4500}
.badge.bad{background:var(--red-soft);color:#7a1f17}
.badge.blue{background:#dcebf3;color:#10384d}
.finished{opacity:.7}

/* Логистика */
.logistics-layout{grid-template-columns:340px minmax(0,1fr);gap:40px}
.dispatch-pool{padding-right:36px;border-right:1px solid var(--line)}
.route-card{border-radius:28px;margin-bottom:20px;border-color:var(--line)}
.route-head{padding:20px 28px;gap:24px;background:rgba(79,90,47,.05);border-bottom:0}
.route-time{font-variant-numeric:normal;font-size:36px;line-height:40px;font-weight:300;letter-spacing:-.03em;padding-right:24px;border-right-color:var(--line-strong)}
.route-time small{font-size:13px;line-height:18px;color:var(--muted)}
.route-name>.link{font-size:18px;line-height:24px;font-weight:500;color:var(--ink)}
.route-name p{font-size:14px;line-height:20px;margin:2px 0 0}
.route-head>button{min-height:44px;font-size:14px;padding:0 22px;border-color:var(--accent);color:var(--accent);background:transparent}
.route-head>button:hover{background:rgba(79,90,47,.08)}
.route-body{grid-template-columns:minmax(0,1fr) 260px}
.route-cargo{padding:24px 28px;gap:16px}
.route-cargo .cargo-card{width:300px;background:#fff;margin:0}
.capacity{border-left:1px solid var(--line);padding:24px 28px;gap:10px;font-size:13px}
.capacity strong{font-size:36px;line-height:40px;font-weight:300;letter-spacing:-.03em}
.capacity strong small{font-size:14px}
.capacity>small{font-size:13px;line-height:18px;margin-top:0}
progress{height:8px;border-radius:999px;background:rgba(79,90,47,.1)}
progress::-webkit-progress-bar{background:rgba(79,90,47,.1);border-radius:999px}
progress::-webkit-progress-value{background:var(--olive-500);border-radius:999px}
progress::-moz-progress-bar{background:var(--olive-500);border-radius:999px}
.pickup-card{border-radius:20px;background:rgba(79,90,47,.06);border:0;padding:14px 20px}
.pickup-card span{font-size:14px}
.external-cargo{border-radius:20px;background:var(--olive-50);font-size:14px;padding:18px 20px}
.external-cargo svg{color:var(--accent)}
.external-cargo p{font-size:13px}
.drop-placeholder{border:1.5px dashed #bcc3a0;border-radius:20px;background:rgba(79,90,47,.03);font-size:15px;min-height:110px;flex-direction:column;gap:4px;text-align:center}
.drop-placeholder small{font-size:13px}
.empty-state,.lane-empty{border:1.5px dashed #cdd3b6;border-radius:20px;font-size:14px}

/* Канбан */
.kanban{grid-template-columns:repeat(7,308px);gap:16px}
.kanban-lane{border-radius:28px;background:#f7f8f1;padding:20px 16px 16px}
.kanban-lane>header{padding:0 6px;margin-bottom:6px;min-height:32px;gap:10px}
.kanban-lane h3{font-size:16px;font-weight:500}
.stage-dot{width:8px;height:8px;background:var(--line-strong)}
.s2,.s3{background:var(--olive-500)}.s4{background:var(--gold)}.s5,.s6{background:var(--success)}
.lane-total{font-size:13px;padding:0 6px 14px;border-bottom-color:var(--line)}
.order-products{font-size:13px}

/* График смен */
.unscheduled{border:1.5px dashed #bcc3a0;border-radius:24px;background:rgba(79,90,47,.03)}
.schedule-scroll{border-radius:28px;border-color:var(--line)}
.schedule-corner,.day-heading{font-size:13px;background:rgba(79,90,47,.05)}
.day-heading b{font-size:16px;font-weight:500}
.day-heading.today{background:rgba(230,193,74,.22)}
.line-heading{background:var(--olive-50);font-size:13px}
.job-tile{background:var(--olive-50);border-color:transparent;border-radius:16px;padding:14px}
.job-tile>.link{font-size:14px}
.job-tile p{font-size:12px}
.job-tile .card-bottom b{font-size:20px}
.cell-add{font-size:12px}

/* Таблицы */
.scroll{border-radius:28px;border-color:var(--line);margin:20px 0 28px}
table{font-size:15px}
th{background:rgba(79,90,47,.05);font-size:13px;font-weight:500;color:var(--muted)}
th,td{padding:18px 24px}
td{border-bottom-color:#eef0e4}
tbody tr:hover{background:rgba(79,90,47,.03)}
.cell-sub{font-size:13px;line-height:18px;margin-top:2px}
.compact th,.compact td{padding:10px 20px}
td button:not(.link){font-size:14px;min-height:40px}
.sort-head{min-height:20px;border:0;padding:0;background:transparent;color:inherit;font-size:13px;gap:8px}
.sort-head:hover{background:transparent;border:0;color:var(--ink)}
.inline-progress progress{width:100px}
.revenue-bar{font-size:15px;padding:20px 0;border-bottom-color:var(--line)}

/* Панели, карточка заказа, диалоги */
.panel,.intro{border-radius:28px;border-color:var(--line);padding:32px}
.intro h2{font-size:32px;line-height:38px;font-weight:300;letter-spacing:-.03em}
.panel p,.intro p,.panel li{font-size:15px;line-height:24px}
.notice{border-radius:20px;background:var(--gold-soft);color:#5a4500;font-size:14px;padding:16px 20px}
.error{border-radius:20px;background:var(--red-soft);border-color:rgba(179,54,43,.25);color:#7a1f17;font-size:14px;padding:16px 20px}
dialog{border-radius:32px;border-color:var(--line);box-shadow:var(--shadow-lg);overflow:auto}
dialog::backdrop{background:rgba(43,51,24,.38);backdrop-filter:blur(4px)}
.dialoghead{padding:28px 32px 20px;border-bottom:0}
.dialoghead h2{font-size:32px;line-height:38px;font-weight:300;letter-spacing:-.03em}
.close{font-size:24px;min-width:44px;min-height:44px;padding:0;color:var(--muted);border:0}
.close:hover{background:rgba(79,90,47,.08);border:0}
.dialogbody{padding:8px 32px 32px}
.dialogfoot{padding:20px 32px;border-top:1px solid var(--line);gap:12px}
.dialogfoot button{font-size:15px}
.formgrid{gap:20px 28px}
.field{font-size:13px;gap:8px;color:var(--muted);font-weight:500}
.field input,.field select{font-size:16px;font-weight:400}
.form-section{font-size:16px;font-weight:500;color:var(--ink);padding-bottom:12px;margin-top:12px}
.tabs{gap:32px;border-bottom-color:var(--line)}
.tabs button{border-radius:0;min-height:0;padding:14px 0;font-size:15px;color:var(--muted);border:0;background:transparent}
.tabs button:hover{background:transparent;color:var(--ink)}
.tabs .primary{background:transparent;border:0;border-bottom:2px solid var(--accent);color:var(--ink);font-weight:500;filter:none}
.statuspath{gap:6px}
.statuspath span{font-size:13px;padding:7px 14px;border-radius:999px;background:rgba(79,90,47,.06)}
.statuspath .on{background:var(--accent);color:#fff;font-weight:500}
.secondary-actions{border-radius:20px;border-color:var(--line);font-size:14px;padding:16px 20px}
.next-action{border-radius:24px;background:var(--olive-50);padding:24px 28px}
.next-action span{font-size:13px}
.next-action b{font-size:16px}
.next-action button{font-size:15px}
.logs{font-size:14px}

/* Уведомление */
.toast{background:var(--ink);border-radius:999px;padding:14px 24px;font-size:14px;box-shadow:var(--shadow-lg)}
.toast button{min-height:0;font-size:14px;color:#fff;border:0}
.toast button:hover{background:transparent;color:var(--gold)}

/* Перетаскивание */
.is-dragging .drop-allowed{outline:2px dashed rgba(79,90,47,.45);outline-offset:-2px}
.drag-over.drop-allowed{background:rgba(79,90,47,.1)!important;outline:2px solid var(--accent)!important}

/* Адаптив: планшет */
@media(max-width:1200px){
  .layout{grid-template-columns:240px minmax(0,1fr)}
  .workspace{padding:32px 24px}
  .top{padding:0 24px}
  .logistics-layout{grid-template-columns:280px minmax(0,1fr);gap:24px}
  .dispatch-pool{padding-right:20px}
  .route-body{grid-template-columns:1fr}
  .capacity{border-left:0;border-top:1px solid var(--line);flex-direction:row;align-items:center;gap:16px;padding:16px 24px;flex-wrap:wrap}
  .capacity progress{width:120px}
  .capacity strong{font-size:24px;line-height:28px}
  .route-cargo .cargo-card{width:100%}
  .route-head{gap:12px;flex-wrap:wrap}
  h1{font-size:44px;line-height:48px}
}

/* Адаптив: телефон */
@media(max-width:760px){
  .layout{display:block}
  .sidebar{display:block;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:12px 16px;margin:0}
  .brand-symbol{width:36px;height:36px;font-size:18px}
  .nav-group,.sidefoot{display:none}
  .nav.mobile{display:flex;overflow:auto;gap:6px;padding:4px 16px 12px}
  .nav.mobile button{white-space:nowrap;font-size:14px;min-height:40px;padding:0 16px;border:1px solid var(--line-strong);justify-content:center}
  .nav.mobile button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav.mobile button.active:after{display:none}
  .top{height:56px;padding:0 16px}
  .workspace{padding:28px 16px 24px}
  .page-heading{align-items:flex-start;margin-bottom:24px;gap:16px}
  h1,.page-heading h1{font-size:36px;line-height:40px}
  .page-heading p{font-size:15px;line-height:22px}
  .page-heading .primary,.actions .primary{min-height:48px;padding:0 20px;font-size:15px}
  .searchbox{flex:1;min-width:180px}
  .searchbox input{width:100%}
  .date-tools input{width:150px}
  .kpi-row{margin-bottom:28px;gap:10px}
  .kpi{padding:16px;border-radius:22px}
  .kpi strong{font-size:30px;line-height:34px}
  .kpi>span,.kpi small{font-size:12px}
  .logistics-layout{display:block}
  .dispatch-pool{border-right:0;padding:0;margin-bottom:28px}
  .route-head{padding:16px 20px;gap:12px}
  .route-name{flex:1 1 150px}
  .route-head>button{width:100%}
  .route-time{font-size:28px;line-height:32px;padding-right:16px}
  .route-cargo{padding:16px 20px}
  .capacity{padding:16px 20px}
  .dialoghead{padding:20px 20px 12px}
  .dialoghead h2{font-size:24px;line-height:30px}
  .dialogbody{padding:8px 20px 24px}
  .dialogfoot{padding:16px 20px}
  .next-action{padding:20px}
  .tabs{gap:20px}
  .panel,.intro{padding:20px;border-radius:24px}
  th,td{padding:14px 16px}
  .kanban-lane{border-radius:24px}
}

/* Application identity */
.brand-symbol{flex-shrink:0;background:transparent}.brand-symbol svg{width:100%;height:100%;display:block}.brand-partner{white-space:nowrap;font-size:12px;font-weight:400}.brand>div{min-width:0}.brand{gap:10px}

/* Заказы: воронка, карточка-сделка, экспресс-вид. Тема VerdaAgro. */

/* План отгрузки по номенклатуре */
.plan-strip{border-radius:28px;background:var(--olive-50);padding:24px 28px;margin-bottom:28px;display:flex;flex-direction:column;gap:20px}
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.plan-sub{font-size:14px;line-height:20px;color:var(--muted);margin-top:2px}
.plan-body{display:flex;align-items:stretch;gap:16px;flex-wrap:wrap}
.plan-total{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:14px 24px;border-radius:20px;background:#fff;min-width:200px}
.plan-total b{font-size:32px;line-height:36px;font-weight:300;letter-spacing:-.03em}
.plan-total span{font-size:14px;color:var(--muted)}
.plan-chips{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button.plan-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:112px;padding:12px 20px;border-radius:20px;border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s}
button.plan-chip span{font-size:13px;line-height:18px;font-weight:500}
button.plan-chip b{font-size:24px;line-height:28px;font-weight:300;letter-spacing:-.02em}
.plan-chip.tone0{background:rgba(79,90,47,.14);color:var(--accent)}
.plan-chip.tone1{background:var(--sage-200);color:var(--ink)}
.plan-chip.tone2{background:var(--gold-soft);color:#5a4500}
.plan-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:transparent}
.plan-chip.tone0:hover{background:rgba(79,90,47,.2)}
.plan-chip.tone1:hover{background:#cfd5b6}
.plan-chip.tone2:hover{background:#f7ebbd}
.plan-chip.selected{border-color:var(--accent);box-shadow:var(--shadow-sm)}
.plan-chip.zero{opacity:.55}
.plan-reset{font-size:14px;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.viewcount{margin-left:auto}
.segmented.density{margin-left:4px}

/* Воронка */
.funnel-lane{padding:16px 14px 16px}
.funnel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 28px 12px 18px;margin-bottom:10px;background:color-mix(in srgb,var(--lane) 18%,#fff);border-radius:14px 0 0 14px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.funnel-head h3{margin:0;font-size:15px;line-height:20px;font-weight:500;flex:1}
.funnel-head .count{background:#fff}
.funnel-meta{display:flex;align-items:baseline;justify-content:space-between;padding:0 8px 12px;font-size:13px;color:var(--muted)}
.funnel-meta b{font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.lane-add{width:100%;min-height:44px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #bcc3a0;background:transparent;color:var(--accent);font-size:14px;font-weight:500}
.lane-add:hover{background:#fff;border-color:var(--accent)}
.lane-add svg{width:16px;height:16px}
.kanban-lane.drop-allowed .lane-add{opacity:.5}

/* Карточка-сделка */
.deal{display:flex;flex-direction:column;gap:6px;padding:14px 16px;cursor:pointer;margin-bottom:10px;transition:transform .15s,box-shadow .15s,border-color .15s}
.deal:hover{transform:translateY(-2px)}
.deal:focus-visible{outline-offset:2px}
.deal-top{display:flex;align-items:center;gap:8px;min-height:28px}
.deal-no{font-size:13px;line-height:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.deal-flag{font-size:11px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--ink)}
.deal-tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.deal-tools .move-btn{width:28px;height:28px;min-height:28px;background:transparent}
.deal-tools .move-btn svg{width:14px}
.deal .deal-title{font-size:17px;line-height:22px;font-weight:500;letter-spacing:-.01em;color:var(--ink);text-align:left}
.deal-sub{font-size:13px;line-height:18px;color:var(--muted)}
.deal-money{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.deal-money b{font-size:20px;line-height:26px;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.deal-money span{font-size:13px;color:var(--muted)}
.cover{height:6px;border-radius:999px;background:rgba(79,90,47,.1);overflow:hidden}
.cover i{display:block;height:100%;border-radius:999px;background:var(--olive-500);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cover.big{height:8px;margin:6px 0 4px}
.deal-cover-note{font-size:12px;line-height:16px;color:var(--muted)}
.deal-lines{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:4px}
.deal-lines li{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:18px}
.deal-lines li span{color:var(--muted)}
.deal-lines li b{font-weight:500;white-space:nowrap}
.deal-next{font-size:12px;line-height:16px;color:var(--muted);padding:8px 10px;border-radius:12px;background:var(--olive-50)}
.deal-next b{color:var(--accent);font-weight:500}
.deal-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid #eef0e4;font-size:13px;color:var(--muted)}
.due{display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(79,90,47,.08);color:var(--accent)}
.due.warn{background:var(--gold-soft);color:#5a4500}
.due.bad{background:var(--red-soft);color:#7a1f17}
.deal-owner{display:flex;align-items:center;gap:6px}
.deal-owner i{width:22px;height:22px;border-radius:50%;background:var(--sage-200);color:var(--accent);font-style:normal;font-size:11px;font-weight:600;display:grid;place-items:center}
.deal-compact{padding:12px 14px}
.deal-compact .deal-sub{display:none}

/* Меню действий карточки */
.deal-menu{position:relative}
.deal-menu summary{list-style:none;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .12s}
.deal-menu summary::-webkit-details-marker{display:none}
.deal-menu summary:hover,.deal-menu[open] summary{background:rgba(79,90,47,.1);color:var(--ink)}
.deal-menu summary svg{width:16px;height:16px}
.deal-menu-panel{position:absolute;right:0;top:32px;z-index:30;min-width:220px;padding:8px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:2px;animation:pop .16s cubic-bezier(.2,.8,.2,1);transform-origin:top right}
.deal-menu-panel button{width:100%;justify-content:flex-start;text-align:left;border:0;background:transparent;min-height:40px;padding:0 14px;font-size:14px;font-weight:400;border-radius:12px}
.deal-menu-panel button:hover{background:rgba(79,90,47,.08)}
.deal-menu-panel hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
button.danger{color:var(--danger)}
.deal-menu-panel button.danger:hover{background:var(--red-soft)}

/* Список */
.row-tools{display:flex;gap:6px}
.icon-tool{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border-color:transparent;background:rgba(79,90,47,.06);display:grid;place-items:center;color:var(--accent)}
.icon-tool.danger{color:var(--danger);background:var(--red-soft)}
.icon-tool svg{width:16px;height:16px}

/* Карточка заказа: боковая панель, два вида */
dialog.drawer{margin:0 0 0 auto;max-height:100vh;height:100vh;border-radius:32px 0 0 32px;border-right:0;width:min(560px,100vw)}
dialog.drawer.wide{width:min(1180px,100vw)}
dialog.drawer[open]{animation:drawer-in .3s cubic-bezier(.2,.8,.2,1)}
dialog.drawer[open]::backdrop{animation:fade-in .25s ease}
.deal-head-actions{display:flex;align-items:center;gap:8px}
.deal-modes button{min-height:36px;padding:0 16px;font-size:13px}
.stepper{list-style:none;margin:0 0 4px;padding:0;display:flex;gap:6px;overflow:auto;padding-bottom:6px}
.stepper li{flex:1 0 auto}
.step-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px 0 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;white-space:nowrap;transition:background .25s,color .25s,border-color .25s,transform .15s}
.step-btn:hover{border-color:var(--accent);background:rgba(79,90,47,.05);transform:translateY(-1px)}
.step-dot{width:28px;height:28px;border-radius:50%;background:rgba(79,90,47,.1);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600;transition:background .25s,color .25s}
.step-dot svg{width:14px;height:14px}
.step-btn.done .step-dot{background:var(--olive-500);color:#fff}
.step-btn.done{color:var(--ink)}
.step-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;animation:step-pop .35s cubic-bezier(.2,.8,.2,1)}
.step-btn.on .step-dot{background:var(--gold);color:var(--ink)}
.step-note{min-height:22px;margin:6px 4px 14px;font-size:13px;line-height:20px;color:#7a1f17}
.step-note.shake{animation:shake .4s}
.deal-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.deal-summary{display:flex;flex-direction:column;gap:18px;padding:22px;border-radius:24px;background:var(--olive-50);position:sticky;top:0}
.deal-label{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-500);font-weight:500;margin-bottom:4px}
.deal-val{font-size:15px;line-height:22px}
.deal-val.strong{font-size:18px;font-weight:500;letter-spacing:-.01em}
.deal-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deal-num{font-size:24px;line-height:28px;font-weight:300;letter-spacing:-.03em}
.deal-badges{display:flex;gap:6px;flex-wrap:wrap}
.deal-actions{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px solid var(--line-strong)}
.deal-actions button{min-height:40px;font-size:14px;background:#fff}
.deal-actions button.danger{background:transparent;border-color:transparent}
.deal-actions button.danger:hover{background:var(--red-soft)}
.deal-main{min-width:0}
.deal-express h3{font-size:20px;line-height:26px;font-weight:400;margin-bottom:12px}
.composer{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.composer .primary{align-self:flex-end}
.feed{list-style:none;margin:0 0 16px;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.feed li{position:relative;font-size:14px;line-height:21px;animation:fade-up .3s both}
.feed li:before{content:'';position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--olive-500);border:2px solid #fff}
.feed li span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.feed-sys:before{background:var(--gold)!important}
/* Экспресс-вид скрывает табы и тяжелые блоки полной карточки */
dialog.drawer:not(.wide) .deal-main>:not(.deal-express):not(.next-action){display:none}
dialog.drawer:not(.wide) .deal-grid{grid-template-columns:1fr}
dialog.drawer:not(.wide) .deal-summary{position:static;display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
dialog.drawer:not(.wide) .deal-summary .deal-block:nth-child(3),dialog.drawer:not(.wide) .deal-summary .deal-block:nth-child(6),dialog.drawer:not(.wide) .deal-summary .deal-block:nth-child(7),dialog.drawer:not(.wide) .deal-actions,dialog.drawer:not(.wide) .deal-pair{grid-column:1/-1}

/* Анимации */
@keyframes drawer-in{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes step-pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes landed{0%{transform:scale(.94);box-shadow:0 0 0 0 rgba(230,193,74,.7)}50%{transform:scale(1.02);box-shadow:0 0 0 8px rgba(230,193,74,.35)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(230,193,74,0)}}
@keyframes leave{to{opacity:0;transform:scale(.9) translateY(-6px);max-height:0;margin:0;padding-top:0;padding-bottom:0}}
.kanban--in .kanban-lane{animation:fade-up .4s both;animation-delay:calc(var(--n)*45ms)}
.kanban--in .deal{animation:fade-up .35s both;animation-delay:calc(var(--n,0)*45ms + var(--i)*40ms + 120ms)}
.deal--moved{animation:landed .7s cubic-bezier(.2,.8,.2,1)}
.deal--leaving{animation:leave .22s ease forwards;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}

/* Адаптив */
@media(max-width:1200px){.deal-grid{grid-template-columns:260px minmax(0,1fr)}.plan-body{flex-direction:column}}
@media(max-width:760px){
  dialog.drawer,dialog.drawer.wide{width:100vw;border-radius:0;height:100dvh;max-height:100dvh}
  .deal-grid,dialog.drawer:not(.wide) .deal-grid{grid-template-columns:1fr}
  .deal-summary{position:static}
  .plan-strip{padding:18px;border-radius:24px}
  .plan-total{min-width:0;width:100%}
  .kanban{grid-template-columns:repeat(7,280px)}
  .viewcount{margin-left:0}
}

/* Уточнения: компактная шапка этапов и заголовок карточки */
.stepper{gap:4px}
.step-btn{gap:6px;padding:0 12px 0 6px;font-size:12.5px;min-height:40px}
.step-dot{width:26px;height:26px;font-size:11px}
dialog.drawer .dialoghead h2{font-size:26px;line-height:32px}
dialog.drawer:not(.wide) .dialoghead h2{font-size:22px;line-height:28px}
.due,.scroll .badge,.nw{white-space:nowrap}
@media(max-width:760px){.plan-head .segmented{width:100%}.plan-head .segmented button{flex:1;white-space:nowrap;padding:0 8px;font-size:13px}}

/* Проверка наличия: зеленый — хватает, желтый — не хватает */
.deal--ok{background:#f2f9ea;border-color:#cfe5b8}
.deal--short{background:#fdf8e6;border-color:#f1e1a0}
.deal--ok:hover{border-color:var(--success)}
.deal--short:hover{border-color:var(--gold)}
.cover.ok i{background:var(--success)}
.cover.short i{background:var(--gold)}
.avail{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px}
.avail-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:16px;margin-bottom:4px}
.avail-row span{color:var(--muted)}
.avail-row b{font-weight:500}
.deal-check{font-size:12px;line-height:16px;font-weight:500;margin-top:2px}
.deal-check.ok{color:#2d6a1b}
.deal-check.short{color:#7a5a00}
.deal-summary .avail-row{font-size:13px;line-height:18px}
.deal-summary .deal-check{font-size:13px;line-height:18px;margin:6px 0 10px}
.deal-summary .deal-block>button{min-height:36px;font-size:13px;background:#fff}
.qty-hint{display:block;font-size:12px;line-height:16px;font-weight:400;color:var(--muted)}
.qty-hint.ok{color:#2d6a1b}
.qty-hint.short{color:#7a5a00}

/* Склад и рецептуры. Тема VerdaAgro. */
.actions.bar{margin:0 0 20px;gap:12px}
.actions.bar .primary{min-height:48px;padding:0 24px}
.selectall{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.rawpick{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:16px}
.rawpick input{flex-shrink:0}
button.link.mini{display:inline-flex;align-items:center;gap:6px;margin:4px 0 0 30px;font-size:13px;color:var(--muted)}
button.link.mini svg{width:14px;height:14px}
button.link.mini:hover{color:var(--accent)}
tr.warnrow td{background:rgba(251,243,210,.5)}
tr.sel td{background:rgba(79,90,47,.07)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.pick{font-size:15px;font-weight:500;color:var(--ink)}
.reservecell{display:flex;flex-direction:column;gap:6px;min-width:140px}
.reservecell span{font-size:14px}
.delta{font-weight:500;font-variant-numeric:tabular-nums}
.delta.minus{color:#b3362b}
.delta.plus{color:#2d6a1b}
.legend{border:1px solid var(--line);border-radius:20px;padding:14px 20px;margin:0 0 16px;font-size:14px}
.legend summary{cursor:pointer;color:var(--accent);font-weight:500}
.legend ul{margin:12px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:500}

/* Готовая продукция */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.side-panel{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:28px;background:var(--olive-50)}
.side-panel h3{margin:0;font-size:22px;line-height:28px;font-weight:400;letter-spacing:-.01em}
.side-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-500);font-weight:500;margin-top:8px}
.side-chips{display:flex;gap:8px;flex-wrap:wrap}
.datechip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;font-size:13px;color:var(--muted)}
.datechip b{font-size:16px;font-weight:500;color:var(--ink)}
button.side-order{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:0;padding:12px 16px;border-radius:20px;border:0;background:#fff;text-align:left;transition:transform .15s,box-shadow .15s}
button.side-order:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);background:#fff}
.side-order span{display:flex;flex-direction:column;gap:2px}
.side-order b{font-size:15px;font-weight:500}
.side-order small{font-size:13px;color:var(--muted)}
button.side-history{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;border-color:var(--accent);color:var(--accent);background:transparent}
button.side-history svg{width:18px;height:18px}

/* Расчет потребности */
.notice.flow{border-radius:20px;margin:0 0 24px}
.notice.flow b{font-weight:500}
table.needs td,table.needs th{padding:16px 20px}
table.needs td.feedcell,table.needs td.needcell{vertical-align:top;background:#fbfcf7}
table.needs tr.grp td{border-top:1px solid var(--line)}
table.needs tbody tr:first-child td{border-top:0}
table.needs tbody tr:hover{background:transparent}
table.needs td.feedcell b{font-size:16px;font-weight:500}
table.needs td.needcell{font-size:20px;font-weight:300;letter-spacing:-.02em}
.stockpill{display:inline-block;padding:6px 14px;border-radius:12px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.stockpill.good{background:var(--green-soft);color:#2d6a1b}
.stockpill.bad{background:var(--red-soft);color:#7a1f17}
.empty-block{text-align:center;padding:48px 24px;border:1.5px dashed #cdd3b6;border-radius:28px;background:rgba(79,90,47,.03);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty-block h3{margin:0;font-size:22px;font-weight:400}
.empty-block p{max-width:480px;color:var(--muted);margin:0 0 8px}

/* Закупки */
.sheet{margin-top:8px;padding:28px;border-radius:28px;background:var(--olive-50)}
.sheet-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.sheet-head h3{margin:4px 0 0;font-size:24px;line-height:30px;font-weight:300;letter-spacing:-.02em}
.sheet .scroll{background:#fff;margin:12px 0 16px}
.sheet-total{display:flex;justify-content:flex-end;align-items:baseline;gap:16px;padding:0 8px;font-size:14px;color:var(--muted)}
.sheet-total b{font-size:28px;line-height:32px;font-weight:300;letter-spacing:-.03em;color:var(--ink)}

/* Рецептуры */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.facts div{padding:14px 18px;border-radius:20px;background:var(--olive-50)}
.facts span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-500);font-weight:500;margin-bottom:2px}
.facts b{font-size:16px;font-weight:500}
.recipe-total{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-radius:20px;background:var(--olive-50);margin-bottom:8px;font-size:15px}
.recipe-total b{font-size:20px;font-weight:400}
.recipe-sum{font-size:14px;margin:4px 0 0}
.recipe-sum.ok{color:#2d6a1b}
.recipe-sum.bad{color:#7a1f17}

@media(max-width:1200px){.split{grid-template-columns:1fr}.side-panel{position:static}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.facts{grid-template-columns:1fr}.selectall{margin-left:0}.sheet{padding:18px;border-radius:24px}.actions.bar .primary{width:100%}}

/* Производство. Тема VerdaAgro. */
.daynav{display:flex;gap:8px;margin-bottom:24px;max-width:640px}
.daynav button{flex:1;min-height:48px;background:#fff}
.daynav button.on{background:var(--gold);border-color:var(--gold);font-weight:500}
.linesettings{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:20px 28px;border-radius:28px;background:var(--olive-50);margin-bottom:24px}
.linesettings div:not(:last-child){display:flex;flex-direction:column;gap:2px}
.linesettings span,.dayhours span,.daytotals span,.jobstrip span,.mtot span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-500);font-weight:500}
.linesettings b,.dayhours b{font-size:18px;font-weight:400;letter-spacing:-.01em}
.linesettings button,.dayhours button{margin-left:auto}
tr.today td{background:rgba(230,193,74,.14)}
tr.today td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.todaytag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--ink);margin-left:6px}
.eff{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:500;font-style:normal;background:rgba(79,90,47,.08);color:var(--accent);font-variant-numeric:tabular-nums}
.eff.ok{background:#e4f1d7;color:#2d6a1b}
.eff.mid{background:var(--gold-soft);color:#5a4500}
.eff.low{background:var(--red-soft);color:#7a1f17}
tr.done td{background:rgba(79,90,47,.03)}
tr.run td{background:rgba(220,235,243,.4)}
.hl{display:inline-block;padding:3px 10px;border-radius:10px;background:var(--gold-soft);color:#5a4500;font-weight:500;white-space:nowrap}
.hl.bad{background:var(--red-soft);color:#7a1f17}
table button:disabled{opacity:.45}

/* День */
.dayhead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.7fr);gap:16px;margin-bottom:16px}
.dayhours{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:20px 28px;border-radius:28px;background:var(--olive-50)}
.dayhours div:not(:last-child){display:flex;flex-direction:column;gap:2px}
.daybtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:20px 24px;border-radius:28px;border:1px solid var(--line)}
.daybtns button{min-height:44px;font-size:14px}
.daycomment{display:flex;gap:12px;align-items:flex-end;margin-bottom:24px}
.daycomment .field{flex:1;margin:0}
.daytotals{display:flex;gap:16px;margin:-8px 0 20px}
.daytotals div{flex:1;max-width:320px;padding:16px 22px;border-radius:24px;background:var(--gold-soft);display:flex;flex-direction:column;gap:2px}
.daytotals b{font-size:28px;line-height:32px;font-weight:300;letter-spacing:-.03em}

/* Неделя */
.weekwrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start;margin-bottom:20px}
.unsorted{padding:20px;border-radius:28px;background:var(--olive-50);display:flex;flex-direction:column;gap:16px;min-height:200px}
.unsorted h3,.weekhead h3{margin:0;font-size:20px;line-height:26px;font-weight:400}
.ugroup{display:flex;flex-direction:column;gap:8px}
.uhead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:0 4px}
.uhead span{color:var(--muted);font-size:13px}
.unsorted .job-tile{background:#fff;margin:0}
.week{min-width:0}
.weekhead{display:flex;align-items:center;gap:20px;margin-bottom:12px;flex-wrap:wrap}
.weekhead button{margin-left:auto}
.legend2{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend2 span{display:flex;align-items:center;gap:6px}
.sw{width:18px;height:12px;border-radius:4px;display:inline-block}
.sw.gp,.chip.gp{background:repeating-linear-gradient(135deg,#cfe3ee 0 5px,#dcebf3 5px 10px)}
.sw.ex,.chip.ex{background:repeating-linear-gradient(135deg,#f3d6d2 0 5px,#f9e6e3 5px 10px)}
.schedule-scroll{border-radius:28px}
.wgrid{display:grid;grid-template-columns:92px repeat(10,minmax(124px,1fr));min-width:1340px}
.wcorner,.wday,.wshift{padding:14px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;background:rgba(79,90,47,.05)}
.wday{grid-column:span 2;display:flex;flex-direction:column;gap:6px;text-align:center}
.wday b{font-size:14px;font-weight:500}
.wday.today{background:rgba(230,193,74,.22)}
.wsub{display:grid;grid-template-columns:1fr 1fr;font-size:11px;color:var(--muted)}
.wshift{background:var(--olive-50);display:flex;align-items:center}
.wcell{min-height:150px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:2px;border-radius:12px;padding:2px 2px 2px 0;border:1px solid rgba(43,51,24,.08);cursor:grab}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,90,47,.25)}
.chip-main{flex:1;min-width:0;min-height:0;border:0;background:transparent;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;font-size:12px;line-height:16px;border-radius:12px}
.chip-main:hover{background:rgba(255,255,255,.5)}
.chip-main b{font-weight:600}
.chip-main .l1{color:var(--ink)}
.chip-main .l2{color:var(--muted);font-size:11px}
.chip .move-btn{width:24px;height:24px;min-height:24px;background:transparent}
.chip-flag{font-size:10px;padding:0 8px;color:var(--muted)}
.jobstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px 20px;align-items:end;padding:20px 24px;border-radius:28px;background:var(--olive-50);margin-bottom:8px}
.jobstrip div{display:flex;flex-direction:column;gap:2px;min-width:0}
.jobstrip b{font-size:15px;font-weight:500}

/* План/факт по месяцу */
.monthbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.monthnav{display:flex;align-items:center;gap:12px;padding:6px;border-radius:999px;border:1px solid var(--line-strong)}
.monthnav b{min-width:160px;text-align:center;font-weight:500;font-size:15px}
.monthnav button{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%}
.mtot{padding:12px 20px;border-radius:24px;background:var(--olive-50);display:flex;flex-direction:column;gap:4px}
.mtot div{display:flex;align-items:center;gap:10px}
.mtot b{font-size:20px;font-weight:400}
.pftable{min-width:900px}
.pftable th{text-align:center;font-size:13px;padding:12px 8px}
.pftable th.sub{font-weight:400;font-size:12px}
.pftable th.dow{background:var(--olive-50);color:var(--ink);font-weight:500;width:56px}
.pftable td{padding:6px;text-align:center;border-left:1px solid #eef0e4;height:52px}
.pftable td.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(79,90,47,.04) 6px 12px)}
.pf{min-height:34px;padding:0 12px;border-radius:999px;border:0;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.pf.ok{background:#e4f1d7;color:#2d6a1b}.pf.mid{background:var(--gold-soft);color:#5a4500}.pf.low{background:var(--red-soft);color:#7a1f17}
.pfrules{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.pfrules>div{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-radius:24px;background:var(--olive-50);font-size:14px}
.norm{padding:4px 12px;border-radius:999px;background:#fff;font-size:13px}

/* Потребность */
tr.need-red td{background:rgba(179,54,43,.07)}
tr.need-amb td{background:rgba(251,243,210,.6)}
tr.need-grey td{background:rgba(79,90,47,.04);color:var(--muted)}

/* Форма наряда */
.rrows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px}
.rrow{display:flex;align-items:flex-end;gap:8px}
.rrow .field{flex:1}
.rrow[hidden]{display:none}
.rrm{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;margin-bottom:12px;color:var(--danger)}
.radd{display:flex;gap:10px;align-items:center;margin:8px 0 6px}
.radd select{min-width:200px}
.planbox{padding:20px 24px;border-radius:24px;background:var(--olive-50);margin-bottom:12px}
.planbox .field b{font-size:18px;font-weight:400}
.planbox .field small{font-size:12px;color:var(--muted);font-weight:400}
.stamps{font-size:14px;color:var(--muted);margin:-8px 0 12px}
.stamps b{color:var(--ink);font-weight:500}
table.mixgrid{margin:12px 0}
table.mixgrid th,table.mixgrid td{border:1px solid var(--line-strong);padding:8px 10px;text-align:center;font-size:13px}
table.mixgrid td:first-child{text-align:left}
td.circle{color:var(--muted)}
.signs{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:28px;font-size:13px}

@media(max-width:1200px){.dayhead{grid-template-columns:1fr}.weekwrap{grid-template-columns:1fr}.jobstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.rrows{grid-template-columns:1fr}.linesettings,.dayhours{gap:16px}.daycomment{flex-direction:column;align-items:stretch}.daytotals{flex-direction:column}}

.page-day .page-heading h1{font-size:44px;line-height:48px}
.page-day .scroll table{min-width:1500px}
.wcell{min-height:130px}

.row-tools{flex-wrap:nowrap}
.row-tools button{min-height:38px;padding:0 14px;font-size:13px}
td:last-child{white-space:nowrap}
.printform{overflow:auto}

/* Логистика. Тема VerdaAgro. Цвета типов груза: зеленый — доставка клиенту БЭКС, синий — везем свое, красный — коммерческая перевозка. */
:root{--c-del:#3a8227;--c-del-bg:#eaf4df;--c-own:#2f7fa8;--c-own-bg:#e1eef5;--c-com:#b8504a;--c-com-bg:#f8e6e3}
.kdot{display:inline-block;width:12px;height:12px;border-radius:50%;flex-shrink:0;vertical-align:-1px}
.kdot.del{background:var(--c-del)}.kdot.own{background:var(--c-own)}.kdot.com{background:var(--c-com)}

/* Задания */
.filterrow{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 20px}
.filterrow .field{margin:0;min-width:240px}
.filterrow select{min-height:48px;border-radius:999px;padding:0 20px}
.complcell{display:flex;flex-direction:column;gap:6px;min-width:150px;align-items:flex-start}
.complcell .cover{width:100%}
.complcell small{font-size:12px;color:var(--muted)}

/* Доска рейсов */
.page-trips #periodFilter{display:none}
.tripbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.kindlegend{display:flex;gap:8px;flex-wrap:wrap}
button.kindchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;font-size:14px;border-radius:999px;border:1px solid transparent}
.kindchip.del{background:var(--c-del-bg);color:#245b17}.kindchip.own{background:var(--c-own-bg);color:#1c5a7a}.kindchip.com{background:var(--c-com-bg);color:#8a2f2a}
.kindchip:hover{border-color:currentColor;background:inherit}
.kindchip.selected{border-color:currentColor;box-shadow:var(--shadow-sm)}
.logistics-layout{grid-template-columns:320px minmax(0,1fr);gap:32px}
button.catalog-link{margin-top:12px;width:100%;border-color:var(--accent);color:var(--accent);background:transparent}
.lanes{min-width:0;display:flex;flex-direction:column;gap:16px}
.lane{position:relative;border-radius:28px;border:1px solid var(--line);background:#fff}
.lane.kind-del{--kc:var(--c-del);--kb:var(--c-del-bg)}.lane.kind-own{--kc:var(--c-own);--kb:var(--c-own-bg)}.lane.kind-com{--kc:var(--c-com);--kb:var(--c-com-bg)}
.lane:before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:6px;border-radius:0 6px 6px 0;background:var(--kc)}
.lane-head{position:relative;display:flex;align-items:center;gap:20px;padding:18px 24px 18px 30px;border-radius:28px 28px 0 0;background:linear-gradient(90deg,var(--kb),transparent 70%);outline-offset:-3px}
.lane-id{display:flex;flex-direction:column;min-width:96px}
.lane-id b{font-size:18px;font-weight:500;letter-spacing:-.01em}
.lane-id span{font-size:13px;color:var(--muted)}
.lane-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lane-title .link{font-size:17px;font-weight:500;color:var(--ink);text-align:left}
.lane-title small{font-size:13px;color:var(--muted)}
.lane-kinds{display:flex;gap:4px}
.lane-head>button{min-height:40px;font-size:14px;border-color:var(--accent);color:var(--accent);background:transparent}
.lane-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;padding:6px 24px 22px 30px}
.lane-cards{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;min-width:0}
.lane .cargo-card{width:260px;margin:0;border-left:5px solid var(--c-del);background:var(--c-del-bg);border-color:rgba(58,130,39,.25);border-left-color:var(--c-del)}
.lane .cargo-card:hover{border-color:var(--c-del)}
.extra-card{width:260px;display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:20px;border:1px solid transparent}
.extra-card b{display:block;font-size:15px;font-weight:500}
.extra-card small{font-size:13px;color:var(--muted)}
.extra-card.own{background:var(--c-own-bg);border-left:5px solid var(--c-own)}
.extra-card.com{background:var(--c-com-bg);border-left:5px solid var(--c-com)}
.lane .drop-placeholder{width:100%;min-height:96px}
.lane-cap{display:flex;flex-direction:column;gap:10px;align-self:stretch;justify-content:center}
.cap-pill{display:flex;flex-direction:column;align-items:flex-start;padding:14px 20px;border-radius:28px;background:var(--olive-50)}
.cap-pill span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-500);font-weight:500}
.cap-pill strong{font-size:32px;line-height:36px;font-weight:300;letter-spacing:-.03em}
.cap-pill small{font-size:13px;color:var(--muted)}
.cap-pill.full{background:var(--gold-soft)}
.cap-note{font-size:12px;line-height:16px;padding:0 6px}
.cap-note.ok{color:#2d6a1b}.cap-note.warn{color:#7a5a00}
.lane.finished{opacity:.75}

/* Всплывающая карточка рейса */
.trip-pop{display:none;position:absolute;left:30px;top:calc(100% - 4px);z-index:40;width:min(460px,calc(100% - 60px));padding:20px 22px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:pop .16s cubic-bezier(.2,.8,.2,1);transform-origin:top left;pointer-events:none}
.lane-head:hover .trip-pop,.lane-head:focus-within .trip-pop{display:block}
.pop-title{display:flex;flex-direction:column;margin-bottom:10px}
.pop-title b{font-size:18px;font-weight:500}
.pop-title span{font-size:14px;color:var(--muted)}
.trip-pop dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.trip-pop dl div{display:flex;flex-direction:column;gap:0}
.trip-pop dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-500);font-weight:500}
.trip-pop dd{margin:0;font-size:14px;line-height:20px}
.pop-flags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.pop-flags span{display:flex;align-items:center;gap:6px}

/* Окно рейса */
.tripsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.tripsum>div{padding:16px 20px;border-radius:24px;background:var(--olive-50);display:flex;flex-direction:column;gap:6px}
.tripsum>div.warn{background:var(--gold-soft)}
.tripsum span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-500);font-weight:500}
.tripsum b{font-size:16px;font-weight:500;line-height:22px}
.tsec{padding:22px 24px;border-radius:24px;border:1px solid var(--line);margin-bottom:14px}
.tsec h3{margin:0 0 14px;font-size:18px;font-weight:500}
.tsec h4{margin:18px 0 4px;font-size:15px;font-weight:500}
.exrow{display:grid;grid-template-columns:200px minmax(0,1fr) 140px 44px;gap:12px;align-items:end;margin-top:6px}
.exrow[hidden]{display:none}
.exrow .rrm{margin-bottom:12px}
button.addextra{margin-top:10px;border-style:dashed;border-color:#bcc3a0;color:var(--accent);background:transparent}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button.tagchip{min-height:36px;padding:0 16px;font-size:13px;background:#fff}
button.tagchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tasklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tasklist .task{padding:14px 18px;border-radius:20px;background:var(--olive-50)}
.tasklist .task p{margin:2px 0;font-size:13px;color:var(--muted)}

@media(max-width:1200px){.logistics-layout{grid-template-columns:1fr}.lane-body{grid-template-columns:1fr}.lane-cap{flex-direction:row;align-items:center;flex-wrap:wrap}.tripsum{grid-template-columns:1fr}}
@media(max-width:760px){.lane-head{flex-wrap:wrap;padding:16px 18px 16px 24px;gap:10px}.lane-title{flex-basis:100%;order:3}.lane-body{padding:6px 16px 18px 24px}.lane .cargo-card,.extra-card{width:100%}.exrow{grid-template-columns:1fr 1fr}.exrow .rrm{grid-column:2}.tasklist{grid-template-columns:1fr}.trip-pop{left:12px;width:calc(100% - 24px)}.filterrow .field{min-width:100%}}

@media(max-width:760px){.tripbar .segmented{width:100%}.tripbar .segmented button{flex:1;padding:0 6px;font-size:13px;white-space:nowrap}}

/* Brand lockup and collapsible section rail, sharing the Verda palette. */
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:22px 0;margin:0 0 8px;flex-shrink:0}
.sidebar .brand-symbol{width:44px;height:44px;flex:0 0 44px}
.sidebar .brand-name{height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px;flex:1;min-width:0}
.sidebar .brand-name b{font-size:18px;line-height:21px;font-weight:500;letter-spacing:.015em}

/* Компактная карточка наряда */
#modal .job-card{min-width:0;font-size:14px;line-height:1.45}
#modal .job-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:14px 16px;background:var(--olive-50);border-radius:16px;margin-bottom:16px}
#modal .job-summary span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
#modal .job-summary b{display:block;font-size:19px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
#modal .job-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);margin-bottom:18px;padding-bottom:6px}
#modal .job-tabs button{flex:1;border-radius:10px;min-width:0;padding:8px 10px;font-size:14px}
#modal .job-tabs button[aria-selected=true]{background:var(--olive-700,#4e5a2c);color:white;border-color:var(--olive-700,#4e5a2c)}
#modal [data-job-pane][hidden]{display:none!important}
#modal .job-card h3{font-size:15px;margin:0 0 12px;line-height:1.4}
#modal .job-card .facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}
#modal .job-card .facts>div{padding:0;background:none;border-radius:0;min-width:0}
#modal .job-card .facts span{font-size:12px;margin-bottom:3px}
#modal .job-card .facts b{font-size:14px;font-weight:600;line-height:1.4}
#modal .job-card .planbox{padding:14px;border-radius:12px;margin-bottom:12px}
#modal .job-card .formgrid{gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
#modal .job-card .field{font-size:13px;margin:0;min-width:0}
#modal .job-card .field b{font-size:16px;font-weight:600}
#modal .job-card input{height:38px;min-height:38px;padding:7px 10px;font-size:14px;min-width:0;width:100%;box-sizing:border-box}
#modal .job-card .rrows{display:grid;grid-template-columns:1fr;gap:0;margin-bottom:12px}
#modal .job-card .rrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
#modal .job-card .rrow[hidden]{display:none}
#modal .job-card .rrow .field{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:12px;align-items:center;flex:1}
#modal .job-card .rrm{width:32px;height:32px;min-height:32px;padding:0;flex:none}
#modal .job-card .radd{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#modal .job-card .radd>*{min-width:0;max-width:100%}
#modal .job-card .recipe-sum{font-size:13px;margin:10px 0;line-height:1.5}
#modal .job-card .notice,#modal .job-card .muted,#modal .job-card .stamps{font-size:13px;line-height:1.5}
@media(max-width:480px){#modal .job-summary{gap:8px;padding:12px}#modal .job-summary b{font-size:16px}#modal .job-card .formgrid{grid-template-columns:1fr}}


#modal.quality-card .dialoghead{padding:14px 18px;min-height:66px;box-sizing:border-box}
#modal.quality-card .dialoghead h2{font-size:18px;line-height:1.35;font-weight:600}
#modal.quality-card .dialogbody{padding:16px 18px;scrollbar-gutter:stable;overflow-x:hidden}
#modal.quality-card .dialogfoot{padding:12px 18px;gap:8px;min-height:64px;box-sizing:border-box}
#modal.quality-card .dialogfoot button{padding:8px 12px;min-height:38px;font-size:13px}
#modal.quality-card .deal-main{width:100%;max-width:100%;min-width:0;padding:0;background:none}
#modal.quality-card .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:12px 0 16px;padding:0 0 8px;border-bottom:1px solid var(--line-strong);width:100%}
#modal.quality-card .tabs button{padding:8px 4px;min-width:0;font-size:13px;border-radius:10px;white-space:nowrap}
#modal.quality-card .tabs button.selected{background:#4f5a2f;color:#fff;border-color:#4f5a2f}
#modal.quality-card .card-status{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;min-height:28px}
#modal.quality-card .card-status>span:last-child{color:var(--muted)}
#modal.quality-card .order-totals{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--olive-50);border-radius:12px;margin-bottom:12px;font-size:12px}
#modal.quality-card .order-totals b{display:block;font-size:19px;line-height:1.4;font-weight:600}
#modal.quality-card .order-position{padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
#modal.quality-card .position-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;line-height:1.4;margin:0}
#modal.quality-card label.position-heading{justify-content:flex-start;cursor:pointer}
#modal.quality-card .position-heading input{width:16px;height:16px;min-height:16px;flex:none;margin:0}
#modal.quality-card .position-state{font-size:12px;color:var(--muted);margin:5px 0 8px}
#modal.quality-card .compact-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:0}
#modal.quality-card .compact-facts>div{min-width:0}
#modal.quality-card .compact-facts dt{font-size:12px;color:var(--muted);line-height:1.4}
#modal.quality-card .compact-facts dd{font-size:14px;margin:2px 0 0;line-height:1.4;overflow-wrap:anywhere}
#modal.quality-card .compact-facts .full{grid-column:1/-1}
#modal.quality-card .delivery-facts{margin:0 0 18px;padding:12px;background:var(--olive-50);border-radius:12px}
#modal.quality-card h3{font-size:15px;line-height:1.4;margin:16px 0 10px}
#modal.quality-card .card-more{border-top:1px solid var(--line);padding:10px 0;margin:8px 0 0;font-size:13px}
#modal.quality-card .card-more summary{cursor:pointer;font-weight:600;padding:4px 0;line-height:1.4}
#modal.quality-card .card-more .actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#modal.quality-card .card-more button{font-size:13px;padding:7px 10px}
#modal.quality-card .formgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#modal.quality-card .field{font-size:13px;line-height:1.4;margin:0;min-width:0}
#modal.quality-card .field input,#modal.quality-card .control-select-trigger,#modal.quality-card .date-trigger{min-height:38px;font-size:14px}
#modal.quality-card .scroll{overflow:visible;max-height:none;width:100%;min-width:0}
#modal.quality-card .scroll table{width:100%;min-width:0;table-layout:fixed}
#modal.quality-card table th,#modal.quality-card table td{padding:8px;font-size:12px;overflow-wrap:anywhere;white-space:normal}
#modal.quality-card .logs{overflow:visible;max-height:none}
#modal.quality-card .job-card .job-tabs{margin-bottom:14px}
#modal.quality-card .job-card .facts{margin-bottom:14px}
#modal.quality-card .job-card .rrow .field{grid-template-columns:minmax(0,1fr) 80px}
#modal.quality-card .job-card .radd button{font-size:13px;padding:8px 10px}
#modal.quality-card [hidden]{display:none!important}
@media(max-width:480px){#modal.quality-card .dialogbody{padding:14px}#modal.quality-card .dialoghead,#modal.quality-card .dialogfoot{padding:12px 14px}#modal.quality-card .formgrid{grid-template-columns:1fr}#modal.quality-card .order-totals b{font-size:17px}}

#modal.quality-card .job-tabs button[aria-selected="true"]{color:#fff!important;background:#4f5a2f!important;border-color:#4f5a2f!important}
#modal.quality-card .job-tabs button[aria-selected="false"]{color:#273016!important;background:#fff!important;border-color:var(--line-strong)!important}
#modal.quality-card .job-tabs button:hover{color:#273016!important;background:#eef1e7!important}
#modal.quality-card .job-tabs button[aria-selected="true"]:hover{color:#fff!important;background:#3c4623!important}

#modal.quality-card button{transition:none}

/* Fixed action geometry: global button padding must not compress icons. */
#app .row-tools{display:inline-flex;align-items:center;justify-content:center;gap:8px;vertical-align:middle;white-space:nowrap}
#app .row-tools .icon-tool{display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px;width:36px;height:36px;min-width:36px;min-height:36px;max-width:36px;padding:0;margin:0;box-sizing:border-box;line-height:1;border-radius:50%}
#app .row-tools .icon-tool svg{display:block;flex:0 0 16px;width:16px;height:16px;margin:0;pointer-events:none}
#app td:has(>.row-tools){vertical-align:middle;text-align:center;padding:12px 16px;min-width:108px;white-space:nowrap}
#app th:last-child:has(.sort-head){vertical-align:middle}
@media(max-width:760px){#app .row-tools .icon-tool{flex-basis:40px;width:40px;height:40px;min-width:40px;min-height:40px;max-width:40px}#app td:has(>.row-tools){padding:12px;min-width:112px}}


#modal.quality-card .composition-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 12px}
#modal.quality-card .composition-heading h3{margin:0}
#modal.quality-card .composition-heading button{font-size:13px;padding:8px 12px;min-height:36px}
#modal.quality-card .composition-results{border:1px solid var(--line-strong);border-radius:12px;padding:4px;margin:8px 0;background:#fff}
#modal.quality-card .composition-results button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;border-radius:8px;padding:9px 10px;white-space:normal;text-align:left;font-size:13px}
#modal.quality-card .composition-results small{font-size:12px;color:var(--muted);margin-top:3px}
#modal.quality-card .composition-lines{margin-top:12px}
#modal.quality-card .composition-qty{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:16px;margin-top:10px}
#modal.quality-card .composition-qty>span{font-size:12px;color:var(--muted)}
#modal.quality-card .composition-qty b{display:block;font-size:14px;color:var(--ink)}
#modal.quality-card [data-composition-remove]{width:32px;height:32px;min-height:32px;flex:none;padding:0;line-height:1}
#modal.quality-card .composition-total{padding:10px 12px;background:var(--olive-50);border-radius:10px;font-size:13px}
#modal.quality-card .delivery-editor{margin-bottom:18px}

/* Cards fill the lane instead of sizing themselves to their text. */
#app .funnel-lane .lane-cards{align-items:stretch;min-width:0}
#app .funnel-lane .lane-cards>.deal{width:100%;min-width:0;max-width:100%;box-sizing:border-box;align-self:stretch}
#app .funnel-lane .lane-cards>.empty-block{width:100%;box-sizing:border-box}
#app .funnel-lane .deal-title{max-width:100%;overflow-wrap:anywhere}
#app .funnel-lane .deal-tools{flex-shrink:0}

/* Quiet route cards: type color belongs to the header and cargo markers. */
#app .lanes>.lane{border-radius:18px;border-color:#cfd5c5;box-shadow:0 2px 6px #27301605}
#app .lanes>.lane::before{content:none}
#app .lanes>.lane>.lane-head{padding:16px 18px;gap:16px;border-radius:17px 17px 0 0;background:color-mix(in srgb,var(--kb) 45%,white);border-bottom:1px solid #e0e5d9}
#app .lanes>.lane>.lane-body{padding:16px 18px 18px;gap:18px}
#app .lanes .extra-card{border-left-width:1px;border:1px solid color-mix(in srgb,var(--kc) 22%,#e0e5d9);border-radius:14px;padding:14px 16px}
#app .lanes .cargo-card{border-left-width:1px;border-radius:14px;padding:14px 16px}
#app .lanes .drop-placeholder{min-height:88px;border-radius:14px;background:#fafbf8;border-color:#d3d9c6}
#app .lanes .lane-id b,#app .lanes .lane-title .link{font-size:16px;line-height:22px}
#app .lanes .lane-id span,#app .lanes .lane-title small{line-height:20px}
@media(max-width:760px){#app .lanes>.lane>.lane-head{padding:14px;gap:12px}#app .lanes>.lane>.lane-body{padding:14px}}

/* Local interface prototype; shares the application's olive/gold palette. */
.proto{--proto-soft:#f5f6ee;display:flex;flex-direction:column;gap:20px;min-width:0}
.proto p,.proto h2,.proto h3{margin:0}.proto small{color:var(--muted)}
.proto-note{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px dashed var(--line-strong);border-radius:14px;background:#fafbf7;font-size:13px;color:var(--muted)}
.proto-note strong{color:var(--accent);white-space:nowrap}.proto-note span{min-width:0}
.proto-context{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border:1px solid var(--line);border-radius:20px;background:var(--proto-soft)}
.proto-identity{display:flex;align-items:center;gap:14px;min-width:0}.proto-avatar{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#dce3c8;color:var(--accent)}
.proto-avatar svg{width:24px;height:24px}.proto-identity b{display:block;font-size:17px;font-weight:500;overflow-wrap:anywhere}.proto-identity small{display:block;margin-top:2px;font-size:13px}
.proto-context label{width:230px;max-width:100%;margin:0;font-size:12px}.proto-context .ui-control{width:100%}
.proto-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;padding-bottom:0}
.proto-tabs button{border:0;border-radius:0;white-space:nowrap;background:transparent;color:var(--muted);padding:10px 18px;min-height:46px;border-bottom:3px solid transparent}
.proto-tabs button[aria-current=page]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.proto-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.proto-kpi{padding:18px 22px;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:5px;background:white}
.proto-kpi>span{font-size:13px;color:var(--muted)}.proto-kpi strong{font-size:28px;line-height:36px;font-weight:500}.proto-kpi small{font-size:12px}
.proto-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:20px;align-items:start}
.proto-panel{border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0;background:white}
.proto-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.proto-panel-heading h2{font-size:18px;line-height:26px}.proto-panel-heading .link{padding:0;min-height:28px}
.proto-stack{display:flex;flex-direction:column;gap:12px}
.proto-order{display:flex;flex-direction:column;gap:14px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}
.proto-order-top,.proto-order-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.proto-order-top>div{min-width:0}.proto-order h3{font-size:16px;line-height:24px}.proto-order .proto-caption{font-size:12px;color:var(--muted)}
.proto-order p{font-size:14px;line-height:22px}.proto-order .link{padding:0;min-height:26px;text-decoration:underline;text-underline-offset:3px}
.proto-order-bottom{font-size:13px;color:var(--muted)}.proto-order-bottom strong{color:var(--ink);font-size:16px;font-weight:500}
.proto-attention{background:var(--gold-soft);border-color:#dbc985}.proto-attention .proto-avatar{background:#f2dfa0}
.proto-actions{display:flex;flex-wrap:wrap;gap:8px}.proto-actions button{min-height:38px;padding:0 14px;font-size:13px}
.proto-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.proto-step{border-top:3px solid var(--line);padding-top:9px;font-size:12px;color:var(--muted)}.proto-step.done{border-color:var(--accent);color:var(--accent)}.proto-step.active{border-color:var(--gold);color:var(--ink)}
.proto-summary{display:grid;gap:0}.proto-summary>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.proto-summary>div:last-child{border:0}.proto-summary dt{color:var(--muted)}.proto-summary dd{margin:0;text-align:right;overflow-wrap:anywhere}

// Import once, preserve operational balances, posted transactions and job snapshots.
function importBeksaCatalog(state,fresh=false){
 if(state.catalogVersion===BEKSA_CATALOG.version)return state;
 state.catalogBackups??=[];
 if(!fresh)state.catalogBackups.push({version:BEKSA_CATALOG.version,date:new Date().toISOString(),products:structuredClone(state.products),raw:structuredClone(state.raw)});
 for(const source of BEKSA_CATALOG.raw){const existing=state.raw.find(r=>r.id===source.id);if(existing){Object.assign(existing,{source:source.source,sourceRow:source.sourceRow,unit:source.unit,purchaseBatch:source.purchaseBatch,min:source.min,stockKnown:true,priceKnown:existing.price>0});}else state.raw.push(structuredClone(source));}
 for(const source of BEKSA_CATALOG.products){const existing=state.products.find(p=>p.id===source.id);if(existing){const keep={stock:existing.stock,price:existing.price,stockKnown:true,priceKnown:existing.price>0};Object.assign(existing,structuredClone(source),keep);}else state.products.push(structuredClone(source));}
 state.packaging??=structuredClone(BEKSA_CATALOG.packaging);
 state.catalogVersion=BEKSA_CATALOG.version;
 if(fresh)for(const j of state.jobs){const p=state.products.find(p=>p.id===j.p);if(p?.source){j.recipe=structuredClone(p.recipe);j.catalogIssues=structuredClone(p.sourceIssues);}}
 return state;
}

const version='stock-demand-2026-10-05',reserve=id=>state.orders.reduce((n,o)=>n+o.lines.reduce((v,l)=>v+(l.p===id?l.res:0),0),0),hash=s=>[...s].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,7),day=n=>{const d=new Date(TODAY+'T12:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
state.demoScenarioBackup={date:TODAY,raw:state.raw.map(r=>({id:r.id,stock:r.stock,price:r.price})),products:state.products.map(p=>({id:p.id,stock:p.stock,price:p.price}))};
const sorted=[...state.products].sort((a,b)=>hash(a.id)-hash(b.id)),covered=Math.ceil(sorted.length*.9),low=new Set(sorted.slice(covered).map(p=>p.id));
state.stockAdjustments??=[];state.moves??=[];
for(const p of state.products){const before=p.stock;p.demoDailyDemand=200+hash(p.id)%8*100;p.price=p.price>0?p.price:24+hash(p.id)%25;p.priceKnown=true;p.demoPrice=true;p.stockKnown=true;p.demoStock=true;p.stock=reserve(p.id)+p.demoDailyDemand*(low.has(p.id)?.5:3.5+hash(p.id)%4*.5);state.stockAdjustments.push({product:p.id,date:TODAY,type:'Учебная корректировка',qty:p.stock-before,comment:'Запас относительно условного регулярного спроса: '+p.demoDailyDemand+' кг/день'});}
const rawSorted=[...state.raw].sort((a,b)=>hash(a.id)-hash(b.id)),available=Math.round(rawSorted.length*.8);
for(let i=0;i<rawSorted.length;i++){const r=rawSorted[i],before=r.stock,demand=state.products.reduce((n,p)=>n+(p.recipe[r.id]||0)*p.demoDailyDemand*3/500,0);r.stock=i<available?Math.max(100,Math.round((Math.max(demand,r.min||0,500)*(.4+hash(r.id)%17/10))/50)*50):0;r.price=r.price>0?r.price:12+hash(r.id)%80;r.priceKnown=true;r.stockKnown=true;r.demoStock=true;r.demoPrice=true;state.moves.push({raw:r.id,date:TODAY,type:'Учебная корректировка',qty:r.stock-before,comment:'Условные остатки: разные уровни покрытия спроса'});}
const clients=[['АгроСибирь','Анна','Новосибирск'],['Ферма Рассвет','Павел','Томск'],['Зелёный луг','Ольга','Кемерово'],['Птичий двор','Игорь','Новосибирск'],['Конный клуб','Дарья','Бердск'],['Животновод','Алексей','Барнаул']],terms=['Предоплата 100%','50% предоплата / 50% отсрочка','Отсрочка 1 неделя','По факту выгрузки','Индивидуальные условия'];
let oid=Math.max(0,...state.orders.map(o=>Number(o.id)))+1,jid=Math.max(0,...state.jobs.map(j=>Number(j.id)))+1,tid=Math.max(0,...state.tasks.map(t=>Number(t.id)))+1;
for(let i=0;i<12;i++){const c=clients[i%clients.length],due=day([0,1,2,3,5,7][i%6])+'T'+['10:00','14:00','16:00','18:00'][i%4],products=i===11?[sorted.at(-1),sorted.at(-2)]:[sorted[(i*3)%sorted.length],...(i%3===0?[sorted[(i*3+5)%sorted.length]]:[])],lines=products.map(p=>({p:p.id,qty:p.demoDailyDemand*(i%3+1),res:0,sent:0,unitPrice:p.price})),o={id:oid++,company:c[0],contact:c[1],city:c[2],address:'Учебная ул., '+(i+1),delivery:i%4===0?'Самовывоз':'Доставка клиенту',due,priority:i%4===1?'Высокий':'Обычный',manager:i%2?'Мария':'Елена',paid:i%3!==1,agreed:i%4!==2,terms:terms[i%terms.length],lines,notes:['Условный заказ для проверки процессов'],files:[],demo:true};state.orders.push(o);
if(o.agreed)for(const l of o.lines){const p=state.products.find(p=>p.id===l.p);l.res=Math.min(l.qty,Math.max(0,p.stock-reserve(l.p)));if(l.qty>l.res)state.jobs.push({id:jid++,order:o.id,p:p.id,qty:Math.ceil((l.qty-l.res)/500)*500,fact:0,loss:0,status:'Очередь',date:due.slice(0,10),shift:'Дневная',line:'Готовая продукция',recipe:structuredClone(p.recipe),demo:true});if(l.res>0)state.tasks.push({id:tid++,order:o.id,p:p.id,qty:l.res,trip:null,docs:i%3!==0,sent:false,date:due.slice(0,10),demo:true});}}

for(const p of state.products)if(!low.has(p.id)){const required=reserve(p.id)+p.demoDailyDemand*3.5;if(p.stock<required){state.stockAdjustments.push({product:p.id,date:TODAY,type:'Учебной запас',qty:required-p.stock,comment:'Трёхдневный буфер сверх резервов'});p.stock=required;}}

const val=n=>$('#modal [name="'+n+'"]')?.value||'',number=n=>Number(val(n));
function changed(message,close=false){save(message);if(close)$('#modal').close();else if($('#modal').open)drawDialog()}
function act(a,id){const o=O(id),j=J(id),t=T(id),r=R(id);
if(a.startsWith('open-'))return openDialog(a.slice(5),id);
switch(a){
case 'close':$('#modal').close();break;
case 'tab':tab=id;drawDialog();break;
case 'reset':if(confirm('Сбросить все учебные изменения?')){S=seed();localStorage.setItem(KEY,JSON.stringify(S));$('#modal').close();render();toast('Демо восстановлено')}break;
case 'reserve':for(const l of o.lines)l.res+=Math.min(Math.max(0,l.qty-l.sent-l.res),free(l.p));o.checked=true;changed('Остатки проверены и зарезервированы');break;

case 'order-save':{if(!val('company').trim()||!val('city').trim()||!val('due'))return reject('Заполните компанию, город и срок');if(S.tasks.some(x=>x.order===o.id&&(x.trip||x.sent))&&(o.city!==val('city')||o.delivery!==val('delivery')))return reject('Сначала снимите отгрузки с рейсов; у отправленного заказа маршрут изменять нельзя');for(const k of ['company','contact','city','address','delivery','due','priority','manager','terms'])o[k]=val(k);o.paid=$('[name=paid]').checked;changed('Карточка клиента сохранена');break}
case 'order-note':if(!val('note').trim())return reject('Напишите комментарий');o.notes.unshift(new Date().toLocaleString('ru-RU')+' · '+val('note'));changed('Запись добавлена');break;
case 'file-add':if(!val('filename').trim())return reject('Укажите название');o.files.push({category:val('category'),name:val('filename')});changed('Карточка документа добавлена');break;
case 'file-print':window.fileIndex=Number(id);dialogType='printfile';drawDialog();break;
case 'order-create':{let lines=S.products.map(p=>({p:p.id,qty:number('qty-'+p.id),res:0,sent:0}));if(lines.some(l=>!Number.isInteger(l.qty)||l.qty<0))return reject('Объем должен быть целым неотрицательным числом');lines=lines.filter(l=>l.qty>0);if(!lines.length||!val('company').trim()||!val('city').trim()||!val('due'))return reject('Заполните компанию, город, срок и хотя бы одну позицию');const n={id:next(S.orders),company:val('company'),contact:val('contact'),city:val('city'),address:val('address'),delivery:val('delivery'),due:val('due'),priority:'Обычный',manager:'Елена',paid:false,agreed:false,terms:'Предоплата 100%',lines,notes:[],files:[]};S.orders.push(n);save('Создан заказ №'+n.id);openDialog('order',n.id);break}
case 'jobs-selected':case 'jobs-all':{const selected=[...document.querySelectorAll('[name=line]:checked')].map(x=>x.value);let count=0;for(const l of o.lines.filter(l=>a==='jobs-all'||selected.includes(l.p))){let qty=Math.ceil(uncovered(o,l)/500)*500;if(qty){S.jobs.push({id:next(S.jobs),order:o.id,p:l.p,qty,fact:0,status:'Очередь',date:'',shift:'Дневная',line:'Готовая продукция',recipe:{...P(l.p).recipe}});count++}}if(!count)return reject('Нет непокрытого объема у выбранных позиций');changed('Создано нарядов: '+count+'. Назначьте дату в производстве.');break}
case 'tasks-selected':case 'tasks-all':case 'tasks-planned':{const selected=[...document.querySelectorAll('[name=line]:checked')].map(x=>x.value);let count=0;for(const l of o.lines.filter(l=>a!=='tasks-selected'||selected.includes(l.p))){let allocated=sum(S.tasks,x=>x.order===o.id&&x.p===l.p&&!x.sent?x.qty:0);let qty=Math.max(0,(a==='tasks-planned'?l.qty-l.sent:l.res)-allocated);if(qty){S.tasks.push({id:next(S.tasks),order:o.id,p:l.p,qty,trip:null,docs:false,sent:false,date:TODAY});count++}}if(!count)return reject('Доступный объем уже включен в задания. Для частичной отгрузки разделите существующее задание.');changed('Создано заданий: '+count);break}
