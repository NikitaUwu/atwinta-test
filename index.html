const trashIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg>';
const closeMenus=()=>document.querySelectorAll('.deal-menu[open]').forEach(d=>d.removeAttribute('open'));

function coverage(o){const need=sum(o.lines,l=>l.qty-l.sent),res=sum(o.lines,l=>Math.min(l.res,l.qty-l.sent));return{need,res,pct:need?Math.min(100,Math.round(res/need*100)):100}}
function availLine(o,l){const need=Math.max(0,l.qty-l.sent),have=Math.min(need,l.res+Math.max(0,free(l.p)));return{need,have,pct:need?Math.round(have/need*100):100,ok:have>=need}}
function dealTone(o){if(!(o.checked||o.agreed))return '';const ls=o.lines.filter(l=>l.qty-l.sent>0);if(!ls.length)return '';return ls.every(l=>l.res>=l.qty-l.sent)?'ok':'short'}
const availList=o=>`<ul class="avail">${o.lines.filter(l=>l.qty-l.sent>0).map(l=>{const a=availLine(o,l);return `<li><div class="avail-row"><span>${esc(shortName(l.p))}</span><b>доступно ${ton(a.have)} из ${ton(a.need)}</b></div><div class="cover ${a.ok?'ok':'short'}"><i style="width:${a.pct}%"></i></div></li>`}).join('')}</ul>`;
function checkNote(o){const t=dealTone(o);if(t==='ok')return '<div class="deal-check ok">Корм в наличии, резерв создан</div>';if(t==='short'){const q=sum(S.jobs.filter(j=>j.order===o.id&&j.status!=='Готово'),j=>j.qty-j.fact-(j.loss||0));return '<div class="deal-check short">Не хватает корма'+(q?'. Наряд в очереди: '+ton(q):'')+'</div>'}return ''}
function nextStep(o){if(o.lines.every(l=>l.sent>=l.qty))return 'Заказ отгружен';if(!o.checked&&!o.agreed)return 'Проверить остатки';if(o.lines.some(l=>uncovered(o,l)>0))return 'Создать наряд';if(S.jobs.some(j=>j.order===o.id&&j.status!=='Готово'))return 'Ждем выпуск';return 'Оформить отгрузку'}
function dueChip(o){const d=o.due.slice(0,10),t=o.due.slice(11,16),cls=d<TODAY?'bad':d===TODAY?'warn':'';return `<span class="due ${cls}">${d===TODAY?'Сегодня':shortDate(d)} · ${t}</span>`}
function orderMenu(o){const hi=o.priority==='Высокий';return `<details class="deal-menu"><summary aria-label="Действия с заказом №${o.id}" title="Действия">${dotsIcon}</summary><div class="deal-menu-panel" role="menu">${button('Открыть карточку','open-order',o.id)}${button('Редактировать','order-edit',o.id)}${button(hi?'Снять приоритет':'Поставить приоритет','order-priority',o.id)}${button('Переместить на этап…','move-menu','order:'+o.id)}<hr>${button('Удалить заказ','order-delete',o.id,'danger')}</div></details>`}

function planStats(){const from=selectedDate,to=addDays(selectedDate,orderPeriod),os=S.orders.filter(o=>{const d=o.due.slice(0,10);return d>=from&&d<to&&o.lines.some(l=>l.sent<l.qty)}),per=S.products.map((p,i)=>({id:p.id,i,name:shortName(p.id),qty:sum(os,o=>sum(o.lines,l=>l.p===p.id?l.qty-l.sent:0))}));return{from,to,os,per,qty:sum(per,x=>x.qty),money:sum(os,o=>sum(o.lines,l=>(l.qty-l.sent)*P(l.p).price))}}
function planStrip(){const st=planStats(),last=addDays(st.to,-1);return `<section class="plan-strip" aria-label="План отгрузки по номенклатуре"><div class="plan-head"><div><div class="eyebrow">План отгрузки</div><div class="plan-sub">${shortDate(st.from)}${orderPeriod>1?' — '+shortDate(last):''} · ${st.os.length} ${plural(st.os.length,['заказ','заказа','заказов'])}</div></div><div class="segmented" role="group" aria-label="Период плана">${[[1,'1 день'],[3,'3 дня'],[7,'7 дней'],[14,'14 дней']].map(([n,l])=>button(l,'order-period',n,orderPeriod===n?'selected':'')).join('')}</div></div><div class="plan-body"><div class="plan-total"><b>${rub(st.money)}</b><span>${ton(st.qty)}</span></div><div class="plan-chips">${st.per.filter(x=>x.qty>0).map(x=>`<button class="plan-chip tone${x.i%3} ${orderProduct===x.id?'selected':''} ${x.qty?'':'zero'}" data-act="order-product" data-id="${x.id}" aria-pressed="${orderProduct===x.id}"><span>${esc(x.name)}</span><b>${ton(x.qty)}</b></button>`).join('')}${st.per.some(x=>x.qty>0)?'':'<p class="muted">На выбранный период отгрузок не запланировано.</p>'}${orderProduct?button('Сбросить фильтр','order-product',orderProduct,'link plan-reset'):''}</div></div></section>`}

function dealCard(o,i){const cov=coverage(o),hi=o.priority==='Высокий',full=orderDensity==='full',tone=dealTone(o);return `<article class="order-tile deal deal-${orderDensity} ${tone?'deal--'+tone:''} ${justMoved===o.id?'deal--moved':''}" ${dragAttrs('order',o.id)} data-deal="${o.id}" tabindex="0" style="--i:${i}" aria-label="Заказ ${o.id}, ${esc(o.company)}"><div class="deal-top"><span class="deal-no">№${o.id}</span>${hi?'<span class="deal-flag" title="Высокий приоритет">Приоритет</span>':''}<span class="deal-tools">${moveButton('order',o.id)}${orderMenu(o)}</span></div>${link(o.company,'order',o.id).replace('class="link"','class="link deal-title"')}<div class="deal-sub">${esc(o.city)} · ${o.delivery==='Самовывоз'?'Самовывоз':'Доставка'}</div><div class="deal-money"><b>${rub(amount(o))}</b><span>${ton(volume(o))}</span></div>${full?availList(o)+checkNote(o)+`<div class="deal-next">Далее: <b>${nextStep(o)}</b></div>`:`<div class="cover ${tone}" title="Резерв ${ton(cov.res)} из ${ton(cov.need)}"><i style="width:${cov.pct}%"></i></div>`}<div class="deal-bottom">${dueChip(o)}<span class="deal-owner"><i>${esc((o.manager||'?').charAt(0))}</i>${esc(o.manager)}</span></div></article>`}

function ordersList(os){return table(['№','Клиент','Состав','Объем','Сумма','Срок','Этап','Менеджер','Действия'],os.map(o=>row([link('№'+o.id,'order',o.id),link(o.company,'order',o.id)+`<div class="cell-sub">${esc(o.city)} · ${esc(o.contact)}</div>`,o.lines.map(l=>'<span class="nw">'+esc(shortName(l.p))+' '+ton(l.qty)+'</span>').join('<br>'),kg(volume(o)),rub(amount(o)),dueChip(o),badge(stage(o),stage(o)==='Успешно отгружен'||stage(o)==='Готово к отгрузке'?'good':''),esc(o.manager),`<span class="row-tools"><button class="icon-tool" data-act="order-edit" data-id="${o.id}" aria-label="Редактировать заказ №${o.id}" title="Редактировать">${editIcon}</button><button class="icon-tool danger" data-act="order-delete" data-id="${o.id}" aria-label="Удалить заказ №${o.id}" title="Удалить">${trashIcon}</button></span>`])))}

function ordersUX(){
const os=S.orders.filter(o=>matches(o)&&(!orderProduct||o.lines.some(l=>l.p===orderProduct))&&(orderFilter==='all'||orderFilter==='risk'&&o.lines.some(l=>l.res<l.qty-l.sent)||orderFilter==='ready'&&stage(o)==='Готово к отгрузке'));
const board=orderView==='board';
const controls=`<div class="viewbar"><div class="segmented" role="group" aria-label="Вид">${button('Воронка','order-view','board',board?'selected':'')}${button('Список','order-view','list',!board?'selected':'')}</div><div class="filterchips">${[['all','Все заказы'],['risk','Не обеспечены'],['ready','Готовы к отгрузке']].map(([id,n])=>button(n,'order-filter',id,orderFilter===id?'selected':'')).join('')}</div>${board?`<div class="segmented density" role="group" aria-label="Плотность карточек">${button('Компактно','order-density-set','compact',orderDensity==='compact'?'selected':'')}${button('Подробно','order-density-set','full',orderDensity==='full'?'selected':'')}</div>`:''}<span class="muted viewcount">${os.length} ${plural(os.length,['заказ','заказа','заказов'])}</span></div>`;
if(!board)return planStrip()+controls+ordersList(os);
const anim=animateOrders;animateOrders=false;
return planStrip()+controls+`<p class="drag-help">${icon('grip')} Перетаскивайте карточки между этапами. Нажмите на карточку — откроется экспресс-вид.</p><div class="kanban-scroll" tabindex="0" role="region" aria-label="Воронка заказов"><div class="kanban ${anim?'kanban--in':''}">${stages.map((s,i)=>{const list=os.filter(o=>stage(o)===s);return `<section class="kanban-lane funnel-lane" ${dropAttrs('order',s)} style="--lane:${laneTone[i]};--n:${i}"><header class="funnel-head"><h3>${s}</h3><span class="count">${list.length}</span></header><div class="funnel-meta"><b>${rub(sum(list,amount))}</b><span>${ton(sum(list,volume))}</span></div>${i===0?`<button class="lane-add" data-act="open-neworder">${plusIcon}Быстрый заказ</button>`:''}<div class="lane-cards">${list.map(dealCard).join('')||'<div class="lane-empty">Нет заказов</div>'}</div></section>`}).join('')}</div></div>`}

/* Карточка заказа: экспресс-вид и полный вид */
function dealSummary(o){const cov=coverage(o),hi=o.priority==='Высокий',d=o.due.slice(0,10);return `<aside class="deal-summary" aria-label="Кратко о заказе"><div class="deal-block"><div class="deal-label">Клиент</div><div class="deal-val strong">${esc(o.company)}</div><div class="deal-sub">${esc(o.contact)}</div></div><div class="deal-block"><div class="deal-label">Доставка</div><div class="deal-val">${esc(o.city)} · ${esc(o.delivery)}</div><div class="deal-sub">${esc(o.address)}</div></div><div class="deal-block"><div class="deal-label">Состав</div><ul class="deal-lines">${o.lines.map(l=>`<li><span>${esc(P(l.p).name)}</span><b>${kg(l.qty)}</b></li>`).join('')}</ul></div><div class="deal-pair"><div><div class="deal-label">Объем</div><div class="deal-num">${ton(volume(o))}</div></div><div><div class="deal-label">Сумма</div><div class="deal-num">${rub(amount(o))}</div></div></div><div class="deal-block"><div class="deal-label">Дата готовности</div><div class="deal-val">${dueChip(o)}</div></div><div class="deal-block"><div class="deal-label">Наличие на складе</div>${availList(o)}${checkNote(o)}${button('Проверить наличие','order-check',o.id)}</div><div class="deal-block"><div class="deal-label">Метки</div><div class="deal-badges">${badge(hi?'Высокий приоритет':'Обычный приоритет',hi?'warn':'')}${badge(o.paid?'Оплата получена':'Ждем оплату',o.paid?'good':'warn')}${badge(o.manager)}</div></div><div class="deal-actions">${button(hi?'Снять приоритет':'Поставить приоритет','order-priority',o.id)}${button('Удалить заказ','order-delete',o.id,'danger')}</div></aside>`}
function stepper(o){const cur=stages.indexOf(stage(o));return `<ol class="stepper" aria-label="Этап заказа">${stages.map((s,i)=>`<li>${button(`<span class="step-dot">${i<cur?checkIcon:i+1}</span><span class="step-name">${s}</span>`,'order-stage',o.id+'|'+s,'step-btn '+(i<cur?'done':i===cur?'on':''))}</li>`).join('')}</ol><div class="step-note" id="stepNote" role="status" aria-live="polite"></div>`}
function expressPanel(o){return `<section class="deal-express"><h3>Примечания и история</h3><div class="composer"><textarea name="expressnote" rows="2" placeholder="Комментарий, итог звонка, договоренность"></textarea>${button('Добавить примечание','order-express-note',o.id,'primary')}</div><ol class="feed"><li class="feed-sys"><span>Сейчас</span>Этап: ${esc(stage(o))}</li>${o.notes.map(n=>`<li><span>${esc(n.split(' · ')[0])}</span>${esc(n.split(' · ').slice(1).join(' · '))}</li>`).join('')}</ol><p class="muted">Состав, логистика и файлы — в полном виде. ${button('Открыть полный вид','order-mode','full','link')}</p></section>`}
function enhanceOrderDialog(){const o=O(dialogId),m=$('#modal'),body=m.querySelector('.dialogbody'),head=m.querySelector('.dialoghead');if(!o||!body||!head)return;
body.querySelector('.statuspath')?.remove();const err=body.querySelector('#formError'),main=document.createElement('div');main.className='deal-main';[...body.children].forEach(n=>{if(n!==err)main.append(n)});
const grid=document.createElement('div');grid.className='deal-grid';grid.insertAdjacentHTML('beforeend',dealSummary(o));grid.append(main);body.insertAdjacentHTML('beforeend',stepper(o));body.append(grid);if(!orderWide)main.insertAdjacentHTML('beforeend',expressPanel(o));
const close=head.querySelector('.close'),box=document.createElement('div');box.className='deal-head-actions';box.innerHTML=`<div class="segmented deal-modes" role="group" aria-label="Вид карточки">${button('Экспресс','order-mode','express',orderWide?'':'selected')}${button('Полный','order-mode','full',orderWide?'selected':'')}</div>`;head.append(box);box.append(close)}
function enhanceNewOrder(){const m=$('#modal'),c=m.querySelector('[name=company]');m.querySelector('h2').textContent='Новый заказ';if(!c)return;c.setAttribute('list','companyList');c.setAttribute('autocomplete','off');c.placeholder='Название или выберите из списка';const dl=document.createElement('datalist');dl.id='companyList';dl.innerHTML=[...new Set(S.orders.map(o=>o.company))].map(n=>`<option value="${esc(n)}">`).join('');c.after(dl);
['contact','city','address','delivery'].forEach(k=>{const f=m.querySelector('[name='+k+']');f?.addEventListener('input',()=>{f.dataset.touched='1'})});
c.addEventListener('change',()=>{const last=S.orders.filter(o=>o.company===c.value).sort((a,b)=>b.id-a.id)[0];if(!last)return;for(const k of ['contact','city','address','delivery']){const f=m.querySelector('[name='+k+']');if(f&&!f.dataset.touched)f.value=last[k]}});S.products.forEach(p=>{const f=m.querySelector('[name="qty-'+p.id+'"]');if(!f)return;const h=document.createElement('small');f.after(h);const upd=()=>{const q=Number(f.value)||0,fr=Math.max(0,free(p.id));h.className='qty-hint'+(q?(q<=fr?' ok':' short'):'');h.textContent=q?(q<=fr?'Хватает: свободно '+kg(fr):'Не хватает '+kg(q-fr)+' (свободно '+kg(fr)+'). После согласования создастся наряд'):'Свободно на складе: '+kg(fr)};f.addEventListener('input',upd);upd()});
setTimeout(()=>c.focus(),0)}

const drawBeforeOrders=drawDialog;
drawDialog=function(){drawBeforeOrders();const m=$('#modal');m.classList.toggle('drawer',dialogType==='order');m.classList.toggle('wide',dialogType==='order'&&orderWide);if(dialogType==='order')enhanceOrderDialog();if(dialogType==='neworder')enhanceNewOrder()};

const moveCardBase=moveCard;
moveCard=function(kind,id,target){if(kind==='order'){justMoved=Number(id);clearTimeout(window.movedTimer);window.movedTimer=setTimeout(()=>{justMoved=null},1200)}const ok=moveCardBase(kind,id,target);if(!ok&&kind==='order')justMoved=null;return ok};

function stepMessage(text){const n=$('#stepNote');if(n){n.textContent=text;n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake')}}
function undoToast(text,act){$('#toast').innerHTML=`<span>${esc(text)}</span>${button('Отменить',act)}`;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,12000)}
function deleteOrder(o){const blocked=o.lines.some(l=>l.sent>0)||S.jobs.some(j=>j.order===o.id&&j.status!=='Очередь')||S.tasks.some(t=>t.order===o.id&&t.sent);
if(blocked){const msg='Заказ уже в производстве или отгружен — удалить нельзя. Сначала завершите связанные действия.';return $('#modal').open?reject(msg):toast(msg)}
const run=()=>{const snap=JSON.stringify(S);S.orders=S.orders.filter(x=>x.id!==o.id);S.jobs=S.jobs.filter(j=>j.order!==o.id);S.tasks=S.tasks.filter(t=>t.order!==o.id);S.reminders=S.reminders.filter(r=>r.order!==o.id);if($('#modal').open)$('#modal').close();save('Заказ №'+o.id+' удален');undoSnapshot=snap;undoToast('Заказ №'+o.id+' удален','undo-order')};
const card=document.querySelector('.deal[data-deal="'+o.id+'"]');if(card&&!matchMedia('(prefers-reduced-motion: reduce)').matches){card.classList.add('deal--leaving');setTimeout(run,220)}else run()}

const actBeforeOrders=act;
act=function(a,id){
if(a.startsWith('order-')||a==='open-neworder'||a==='open-order')closeMenus();
switch(a){
case 'order-period':orderPeriod=Number(id);animateOrders=true;render();return;
case 'order-product':orderProduct=orderProduct===id?'':id;animateOrders=true;render();return;
case 'order-density-set':orderDensity=id;animateOrders=true;render();return;
case 'order-edit':openDialog('order',Number(id));tab='client';orderWide=true;drawDialog();return;
case 'order-priority':{const o=O(id);if(!o)return;o.priority=o.priority==='Высокий'?'Обычный':'Высокий';save('Заказ №'+o.id+': приоритет '+(o.priority==='Высокий'?'высокий':'обычный'));if($('#modal').open)drawDialog();return}
case 'order-mode':orderWide=id==='full';try{localStorage.setItem('beksa-order-wide',orderWide?'1':'0')}catch{}if($('#modal').open)drawDialog();return;
case 'order-stage':{const [n,s]=id.split('|'),num=Number(n),o=O(num);if(!o||stage(o)===s)return;const err=moveError('order',num,s);if(err)return stepMessage(err);moveCard('order',num,s);drawDialog();return}
case 'order-express-note':{const o=O(id),t=val('expressnote').trim();if(!t)return reject('Напишите комментарий');o.notes.unshift(new Date().toLocaleString('ru-RU')+' · '+t);save('Примечание добавлено');drawDialog();return}
case 'order-check':{const o=O(id);if(!o)return;const r=checkAvailability(o);save('Заказ №'+o.id+': '+availText(r));if($('#modal').open)drawDialog();return}
case 'order-delete':{const o=O(id);if(o)deleteOrder(o);return}
case 'undo-order':if(undoSnapshot){S=JSON.parse(undoSnapshot);save('Заказ восстановлен')}return;
}
actBeforeOrders(a,id)};

/* Движения */
function productMoves(pid){const ev=(S.stockAdjustments||[]).filter(m=>m.product===pid).map(m=>({...m}));S.jobs.filter(j=>j.p===pid&&j.fact>0).forEach(j=>ev.push({date:j.date||TODAY,type:'Производство',qty:j.fact,comment:'Наряд №'+j.id,order:j.order}));S.tasks.filter(t=>t.p===pid&&t.sent).forEach(t=>ev.push({date:t.sentAt||TODAY,type:'Отгрузка',qty:-t.qty,comment:'Задание №'+t.id,order:t.order}));return ev.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function rawMoves(rid){const ev=[];(S.moves||[]).filter(m=>rid==='all'||m.raw===rid).forEach(m=>ev.push({raw:m.raw,date:m.date,type:m.type,qty:m.qty,comment:m.comment}));(S.writeoffs||[]).filter(w=>rid==='all'||w.raw===rid).forEach(w=>ev.push({raw:w.raw,date:w.date,type:'Списание',qty:-w.qty,comment:'Наряд №'+w.job}));return ev.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}

const rid=id,all=id==='all',r=all?null:S.raw.find(x=>x.id===id);return{title:all?'История движений сырья':'Движение по позиции '+r.name,body:(all?'':metrics([['Остаток на складе',kg(r.stock)],['Критический остаток',kg(r.min)],['Потребность',kg(rawNeed(r.id))]]))+table(['Дата',...(all?['Сырье']:[]),'Тип изменения','Изменение','Комментарий'],rawMoves(rid).map(m=>row([shortDate(String(m.date).slice(0,10)),...(all?[esc(S.raw.find(x=>x.id===m.raw).name)]:[]),m.type,signed(m.qty),esc(m.comment)])))+'<p class="muted">Приход — по закупкам и ручному оприходованию, списание — при регистрации выпуска, включая потери.</p>'}}

/* Готовая продукция */
function stockUX(){if(!stockSel||!P(stockSel))stockSel=S.products[0].id;const ps=S.products.filter(matches),sel=P(stockSel),ords=S.orders.filter(o=>o.lines.some(l=>l.p===sel.id&&l.qty>l.sent)),byDate={};ords.forEach(o=>{const d=o.due.slice(0,10);byDate[d]=(byDate[d]||0)+sum(o.lines,l=>l.p===sel.id?l.qty-l.sent:0)});
const rows=ps.map(p=>rowc(p.id===stockSel?'sel':'',[`<button class="link pick" data-act="stock-select" data-id="${p.id}">${esc(p.name)}</button><div class="cell-sub">гранула ${esc(p.granule)} · фасовка ${esc(p.pack||'—')}</div>${p.demoDailyDemand?'<div class="cell-sub">Условный спрос: '+kg(p.demoDailyDemand)+'/день · свободного запаса на '+num(Math.max(0,Math.round(free(p.id)/p.demoDailyDemand*10)/10))+' дня</div>':''}`,kg(p.stock),kg(inOrders(p.id)),kg(inProd(p.id)),kg(reserved(p.id)),badge(kg(free(p.id)),free(p.id)>0?'good':''),rub(p.price)+'/кг',link('Рецептура','recipe',p.id)]));
return kpis([['На складе',ton(sum(S.products,p=>p.stock)),'готовая продукция, всего'],['В резерве под заказы',ton(sum(S.products,p=>reserved(p.id))),'закреплено за заказами'],['Чистый остаток',ton(sum(S.products,p=>Math.max(0,free(p.id)))),'можно отгрузить сверх резерва']])
+`<div class="split"><div class="split-main">${table(['Корм','На складе','В заявках','В производстве','В резерве','Чистый остаток','Цена','Рецептура'],rows)}<p class="muted">В заявках — невыгруженный объем всех заказов. Чистый остаток = на складе минус резерв.</p></div>
<aside class="side-panel" aria-label="Заказы с выбранным кормом"><div class="eyebrow">Выбранный корм</div><h3>${esc(sel.name)}</h3><div class="side-chips">${Object.entries(byDate).sort().map(([d,q])=>`<span class="datechip"><b>${ton(q)}</b>к ${shortDate(d)}</span>`).join('')||'<span class="muted">В активных заказах раздела «Продажи» не участвует</span>'}</div><div class="side-title">Заказы с этим кормом</div>${ords.map(o=>{const l=o.lines.find(x=>x.p===sel.id),a=availLine(o,l);return `<button class="side-order" data-act="open-order" data-id="${o.id}"><span><b>№${o.id} · ${esc(o.company)}</b><small>${ton(l.qty-l.sent)} · к ${shortDate(o.due.slice(0,10))}</small></span><span class="side-order-status ${a.ok?'good':'warn'}" title="${a.ok?'Объём обеспечен':'Не хватает '+ton(a.need-a.have)+' из '+ton(a.need)}"><span>${a.ok?'Хватает':'Не хватает'}</span>${a.ok?'':'<small>'+ton(a.need-a.have)+'</small>'}</span></button>`}).join('')||'<div class="lane-empty">Нет активных заказов с этим кормом</div>'}<button class="side-history" data-act="open-movement" data-id="p:${sel.id}">${histIcon}История перемещений</button></aside></div>`}

/* Сырье */
function rawUX(){const rows=S.raw.filter(matches).map(r=>{const need=rawNeed(r.id),avail=Math.min(need,Math.max(0,r.stock-r.min)),ok=avail>=need,gap=shortage(r);return rowc(gap?'warnrow':'',[`<label class="rawpick"><input type="checkbox" name="rawsel" value="${r.id}" aria-label="Выбрать ${esc(r.name)}"><b>${esc(r.name)}</b></label><button class="link mini" data-act="open-movement" data-id="r:${r.id}">${histIcon}История</button>`,kg(need),kg(r.stock),kg(r.min),need?`<div class="reservecell"><span>${kg(avail)}</span><div class="cover ${ok?'ok':'short'}"><i style="width:${need?Math.round(avail/need*100):100}%"></i></div></div>`:'<span class="muted">Не требуется</span>',badge(kg(gap),gap?'bad':'good')])});
return kpis([['Компонентов',S.raw.length,'Учет в килограммах'],['С дефицитом',S.raw.filter(r=>shortage(r)>0).length,'С учетом критического минимума'],['В резерве производства',kg(sum(S.raw,r=>activeRaw(r.id))),'По запущенным нарядам']])
+`<div class="actions bar"><button class="primary" data-act="purchase-selected">Создать закупку</button>${button('Оформить приход','open-receipt')}${button('История списаний','open-movement','r:all')}<label class="selectall"><input type="checkbox" id="rawAll"> Выбрать все</label></div>`
+table(['Сырье','Нужно зарезервировать','Остаток на складе','Критический остаток','Зарезервировано с учетом потребности','Потребность в закупке'],rows)
+`<details class="legend"><summary>Как читать колонки</summary><ul><li><b>Нужно зарезервировать</b> — потребность по нарядам в очереди и в работе.</li><li><b>Остаток на складе</b> — сколько есть сейчас.</li><li><b>Критический остаток</b> — граница, ниже которой сырье списывать нельзя.</li><li><b>Зарезервировано с учетом потребности</b> — объем доступного сырья под нужды производства.</li><li><b>Потребность в закупке</b> — чего не хватает для производства корма под заказы.</li></ul></details><p class="muted">Резерв создается при пуске наряда. Списание — при регистрации выпуска, включая потери. Если отметок нет, закупка создается по всем позициям с дефицитом.</p>`}

/* Расчет потребности (в разделе «Производство») */
function needsUX(){const jobs=S.jobs.filter(j=>j.status==='Очередь'&&matches(j)),groups={};jobs.forEach(j=>{(groups[j.p]||(groups[j.p]=[])).push(j)});const left={};S.raw.forEach(r=>{left[r.id]=Math.max(0,r.stock-r.min)+pending(r.id)});let gapTotal=0,reqTotal=0;
const body=Object.entries(groups).map(([pid,js])=>{const p=P(pid),qty=sum(js,j=>j.qty),ing=S.raw.filter(r=>js.some(j=>(j.recipe[r.id]||0)>0)).map(r=>{const req=sum(js,j=>(j.recipe[r.id]||0)*(j.qty-j.fact-(j.loss||0))/500),use=Math.min(req,left[r.id]),gap=req-use;left[r.id]-=use;gapTotal+=gap;reqTotal+=req;return{r,req,gap}});
return ing.map((x,i)=>`<tr class="${i===0?'grp':''}">${i===0?`<td rowspan="${ing.length}" class="feedcell"><b>${esc(p.name)}</b><div class="cell-sub">${js.map(j=>link('Наряд №'+j.id,'job',j.id)+' · '+link('Заказ №'+j.order,'order',j.order)).join('<br>')}</div></td><td rowspan="${ing.length}" class="needcell">${kg(qty)}<div class="cell-sub">${num(qty/500)} замесов</div></td>`:''}<td>${esc(x.r.name)}</td><td>${kg(x.req)}</td><td><span class="stockpill ${x.gap?'bad':'good'}">${kg(x.r.stock)}</span></td><td>${x.gap?badge(kg(x.gap),'bad'):badge('0 кг','good')}</td></tr>`).join('')}).join('');
const flow='<div class="notice flow"><b>Как формируется расчет.</b> Заказ согласован → готового корма не хватает → создается наряд в очереди → здесь считается сырье по рецептуре на 500 кг → при дефиците создается закупка.</div>';
return kpis([['Нарядов в очереди',jobs.length,ton(sum(jobs,j=>j.qty))+' нужно произвести'],['Сырья по рецептурам',kg(reqTotal),'на все наряды в очереди'],['Не хватает сырья',kg(gapTotal),gapTotal?'нужна закупка':'все есть, можно запускать']])+flow
+(jobs.length?`<div class="scroll"><table class="needs"><thead><tr><th>Корм</th><th>Нужно произвести</th><th>Сырье</th><th>По рецептуре</th><th>Склад</th><th>Закупка</th></tr></thead><tbody>${body}</tbody></table></div><div class="actions bar">${button('Создать закупку дефицита','purchase-create','',gapTotal?'primary':'')}${button('Открыть очередь производства','go-page','production')}</div><p class="muted">Склад: зеленый — сырья хватает с учетом критического остатка и других нарядов, красный — не хватает. Сумма по колонке «Закупка» формирует закупочный лист.</p>`:`<div class="empty-block"><h3>Нарядов в очереди нет</h3><p>Расчет потребности формируется, когда заказ согласован, а готового корма не хватает. Сейчас весь согласованный объем закрыт складом.</p>${button('Перейти к заказам','go-page','orders','primary')}</div>`)}

/* Закупки */
function purchasesUX(){const ps=S.purchases.filter(matches);if(!purchSel||!S.purchases.some(p=>p.id===purchSel))purchSel=S.purchases.at(-1)?.id||0;const sel=S.purchases.find(p=>p.id===purchSel);
const rows=ps.map(p=>{const [lab,tone]=purchLabel[p.status]||[p.status,''];return rowc(p.id===purchSel?'sel':'',[`<button class="link pick" data-act="purchase-select" data-id="${p.id}">№${p.id}</button>`,shortDate(p.date),esc(p.priority),badge(lab,tone),kg(purchQty(p)),shortDate(p.due),p.status==='Черновик'?button('Согласовать','purchase-approve',p.id):p.status==='Согласована'?button('Принять на склад','purchase-receive',p.id):'<span class="muted">Оприходовано</span>'])});
const sheet=sel?`<section class="sheet"><div class="sheet-head"><div><div class="eyebrow">Закупочный лист</div><h3>№${sel.id} от ${shortDate(sel.date)}</h3></div><div class="actions">${button('Сохранить в Excel','export-purchase',sel.id)}${button('Распечатать','open-printpurchase',sel.id)}</div></div>${table(['Сырье','Количество','Цена','Сумма'],Object.entries(sel.items).map(([r,q])=>row([esc(S.raw.find(x=>x.id===r).name),kg(q),rub(rawPrice(r))+'/кг',rub(q*rawPrice(r))])))}<div class="sheet-total"><span>Итого</span><b>${rub(purchSum(sel))}</b></div></section>`:`<div class="empty-block"><h3>Закупок пока нет</h3><p>Закупка создается по дефициту сырья из расчета потребности.</p>${button('Рассчитать закупку','purchase-create','','primary')}</div>`;
return kpis([['Закупок',S.purchases.length,'всего листов'],['К согласованию',S.purchases.filter(p=>p.status==='Черновик').length,'не согласованы'],['К приемке',S.purchases.filter(p=>p.status==='Согласована').length,'ждут поставки']])+`<div class="actions bar">${button('Рассчитать закупку','purchase-create','','primary')}${button('Скачать все закупки (CSV)','export-purchases')}</div>`+table(['Закупка №','Дата создания','Приоритет','Статус','Объем','Срок','Действие'],rows)+sheet}

/* Рецептуры = технологические карты */
function recipesUX(){const ps=S.products.filter(matches);return `<div class="actions bar"><button class="primary" data-act="open-recipenew">Добавить рецептуру</button></div>`+table(['№','Тип','Название','Доступная фасовка','Переупаковка','Состав на замес 500 кг',''],ps.map((p,i)=>row([i+1,'Готовая продукция',`<b>${esc(p.name)}</b><div class="cell-sub">гранула ${esc(p.granule)}</div>`,esc(p.pack||'—'),esc(p.repack||'—'),Object.entries(p.recipe).filter(([,q])=>q>0).map(([r,q])=>`<span class="nw">${esc(S.raw.find(x=>x.id===r).name)}: ${kg(q)}</span>`).join('<br>'),button('Открыть','open-recipe',p.id)])))+'<p class="muted">Технологическая карта и рецептура — один документ. Рецептура наряда может быть уточнена до пуска, изменение здесь действует на новые наряды.</p>'}

const viewBeforeWh=view;

/* Диалоги: движение, печать закупочного листа, рецептура */
function recipeFormFields(p){return `<div class="formgrid">${field('Название','name',p.name)}${field('Гранула','granule',p.granule)}${field('Доступная фасовка','pack',p.pack||'—')}${field('Переупаковка','repack',p.repack||'—')}${field('Бирка','tag',p.tag||'')}${field('Цена, ₽/кг','price',p.price,'number')}</div><h3>Состав на замес 500 кг</h3><div class="formgrid">${S.raw.map(r=>field(r.name+', кг','recipe-'+r.id,p.recipe[r.id]||0,'number')).join('')}</div><p class="muted" id="recipeSum"></p>`}
function whDialog(){if(dialogType==='movement')return movementDialog(dialogId);
if(dialogType==='printpurchase'){const p=S.purchases.find(x=>x.id==dialogId);return{title:'Закупочный лист №'+p.id,body:`<div class="printform"><h2>Закупочный лист № ${p.id} от ${shortDate(p.date)}</h2><p>Подразделение: склад сырья · Приоритет: ${esc(p.priority)} · Срок: ${shortDate(p.due)}</p>${table(['№','Наименование сырья','Кол-во','Ед.','Цена, ₽','Сумма, ₽'],Object.entries(p.items).map(([r,q],i)=>row([i+1,esc(S.raw.find(x=>x.id===r).name),num(q),'кг',num(rawPrice(r)),num(q*rawPrice(r))])))}<p><b>Итого: ${rub(purchSum(p))}</b></p><p>Исполнитель __________________ / ______________</p></div>`,actions:button('Печать','print')}}
if(dialogType==='recipenew'){return{title:'Новая рецептура',body:recipeFormFields({name:'',granule:'2,5 мм',pack:'40 кг',repack:'—',tag:'',price:30,recipe:{}}),actions:button('Создать','recipe-new-save','','primary')}}
const p=P(dialogId),sumq=sum(Object.values(p.recipe),x=>x);
if(recipeEdit)return{title:p.name+' · редактирование',body:recipeFormFields(p),actions:button('Сохранить рецептуру','recipe-save',p.id,'primary')+button('Отмена','recipe-edit')};
return{title:p.name+' · рецептура',body:`<div class="facts">${[['Тип','Готовая продукция'],['Название',p.name],['Доступная фасовка',p.pack||'—'],['Переупаковка',p.repack||'—'],['Бирка',p.tag||'—'],['Гранула',p.granule]].map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>`+table(['Компонент','Количество','Доля'],Object.entries(p.recipe).filter(([,q])=>q>0).map(([k,v])=>row([esc(S.raw.find(x=>x.id===k).name),kg(v),num(v/5)+'%'])))+`<div class="recipe-total">Вес компонентов <b>${kg(sumq)}</b> на 500 кг ${badge(Math.abs(sumq-500)<.001?'Сходится':'Не сходится',Math.abs(sumq-500)<.001?'good':'bad')}</div>`,actions:button('Редактировать','recipe-edit')+button('Печать','print')}}
const drawBeforeWh=drawDialog;

/* Действия */
function readRecipeForm(){const recipe=Object.fromEntries(S.raw.map(r=>[r.id,number('recipe-'+r.id)]));const price=number('price');if(!val('name').trim())return{error:'Укажите название'};if(Object.values(recipe).some(x=>!Number.isFinite(x)||x<0)||Math.abs(sum(Object.values(recipe),x=>x)-500)>.001)return{error:'Сумма компонентов должна быть ровно 500 кг'};if(!Number.isFinite(price)||price<0)return{error:'Цена должна быть неотрицательной; 0 — цена не задана'};return{data:{name:val('name').trim(),granule:val('granule'),pack:val('pack'),repack:val('repack'),tag:val('tag'),price,recipe}}}
function csvFile(name,rows){const csv='﻿Номер;Дата;Статус;Сырье;Количество,кг\r\n'+rows.join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const actBeforeWh=act;
act=function(a,id){switch(a){

case 'export-purchase':{const p=S.purchases.find(x=>x.id==id);if(p)csvFile('beksa-purchase-'+p.id+'.csv',Object.entries(p.items).map(([k,v])=>[p.id,p.date,p.status,S.raw.find(x=>x.id===k).name,v].join(';')));return}

function addJob(orderId,pid,qty,date,shift,lineName){const o=O(orderId);if(!o?.agreed)return{error:'Сначала согласуйте заказ'};const l=line(o,pid);if(!l||qty>Math.ceil(uncovered(o,l)/500)*500)return{error:'Объем превышает непокрытую потребность заказа'};const nj={id:next(S.jobs),order:Number(orderId),p:pid,qty,fact:0,status:'Очередь',date:'',shift,line:lineName,created:TODAY,recipe:{...P(pid).recipe}};S.jobs.push(nj);if(date){const err=moveError('job',nj.id,date+'|'+shift+'|'+lineName);if(err){S.jobs.pop();return{error:err}}nj.date=date}return{job:nj}}

case 'job-plan':{const j=J(id);if(!j||j.status!=='Очередь')return;const b=number('batches');if(!Number.isInteger(b)||b<1)return reject('Количество замесов — целое число от 1');if(!val('date'))return reject('Выберите дату готовности');const old=j.qty;j.qty=b*500;const err=moveError('job',j.id,val('date')+'|'+val('shift')+'|'+val('line'));if(err){j.qty=old;return reject(err)}[j.date,j.shift,j.line]=[val('date'),val('shift'),val('line')];changed('План наряда сохранен: '+b+' зам., '+kg(b*500));return}

case 'purchase-add':{const r=S.raw.find(x=>x.id===id),gap=shortage(r);if(!gap)return;let p=S.purchases.find(x=>x.status==='Черновик');if(!p){p={id:next(S.purchases),date:TODAY,due:TODAY,priority:'Высокий',status:'Черновик',items:{}};S.purchases.push(p)}p.items[id]=(p.items[id]||0)+gap;purchSel=p.id;save('«'+r.name+'» добавлено в закупку №'+p.id+': '+kg(gap));return}

// Keep the current screen in the URL, including refresh and browser history.
function readScreenRoute(){
 const route=new URLSearchParams(location.hash.slice(1).split('?')[1]||'');
 const key=location.hash.slice(1).split('?')[0];
 const screen=key==='process'?'guide':key;
 page=Object.hasOwn(names,screen)?screen:'trips';
 if(page==='ai-assistant')aiAssistantInternalRole=route.get('role')==='buyer'?'buyer':'manager';
 const date=route.get('date');
 if(date&&/^\d{4}-\d{2}-\d{2}$/.test(date)&&!Number.isNaN(Date.parse(date)))selectedDate=date;
 const range=route.get('period');
 if(['day','week','month','all'].includes(range))period=range;
 query='';
}
readScreenRoute();
let routeScreen=page,readingRoute=false;
const renderBeforeRouting=render;
render=function(){
 renderBeforeRouting();
 if(readingRoute)return;
 const params=new URLSearchParams();
 if(['client-portal','supplier-portal'].includes(page)&&location.hash.slice(1).split('?')[0]===page){
  const partnerRoute=new URLSearchParams(location.hash.split('?')[1]||'');
  for(const key of ['section','company'])if(partnerRoute.has(key))params.set(key,partnerRoute.get(key));
 }
 if(page==='ai-assistant')params.set('role',aiAssistantInternalRole);
 if(['day','shifts','trips','sales','revenue','prodreport'].includes(page)){
  params.set('date',selectedDate);params.set('period',period);
 }
 const hash='#'+(page==='guide'?'process':page)+(params.size?'?'+params.toString():'');
 if(location.hash!==hash){
  history[page===routeScreen?'replaceState':'pushState'](null,'',location.pathname+location.search+hash);
 }
 routeScreen=page;
};
function restoreScreenRoute(){
 readingRoute=true;readScreenRoute();routeScreen=page;
 if($('#modal').open)$('#modal').close();
 render();readingRoute=false;
}
window.addEventListener('popstate',restoreScreenRoute);
window.addEventListener('hashchange',restoreScreenRoute);
render();

function aiPreviewOpen(mode,context){

document.addEventListener('click',event=>{
 const control=event.target.closest('[data-ai-preview]');if(!control)return;
 event.preventDefault();const action=control.dataset.aiPreview;
 if(['assistant','import','recommend'].includes(action))return aiPreviewOpen(action,control.dataset.aiContext);

 if(action==='source'){
  aiPreviewSource=control.dataset.aiSource;aiPreviewPaint();aiPreviewDialog.querySelector(`[data-ai-source="${aiPreviewSource}"]`).focus();return;
 }
 if(action==='card-example'){
  aiPreviewShowCard=true;aiPreviewPaint();aiPreviewDialog.querySelector('[data-ai-preview="card-example"]').focus();
 }
});

 if(role==='manager'&&page==='orders'){
  const inbox=$('#app .manager-partner-inbox');
  if(inbox)inbox.insertAdjacentHTML('afterbegin',`<div class="ai-preview-manager-tools">${aiPreviewButton('Разобрать обращение','import')}${aiPreviewButton('Повторные закупки','recommend','repeat')}</div>`);
 }
}
// Add context entry points to existing cards without altering their business actions.
for(const name of ['portalOrderCard','portalPurchaseCard','portalRfqCard']){
 const previous=window[name];
 window[name]=function(record,...args){
  const html=previous(record,...args),label=name==='portalOrderCard'?'Заказ №'+record.id:name==='portalPurchaseCard'?'Поставка №'+record.number:'Запрос на закупку';
  return html.replace('</article>',`<div class="ai-preview-card-entry">${aiPreviewButton('Спросить ИИ','assistant',label,'ai-preview-card-button')}</div></article>`);
 };
}
const aiPreviewPortalOpenBefore=portalOpen;
portalOpen=function(title,body,submit='',state={}){
 aiPreviewPortalOpenBefore(title,body,submit,state);
 const dialogBody=portalDialog.querySelector('.dialogbody');
 if(['request','partner-proposal','offer','listing'].includes(state.type))dialogBody.insertAdjacentHTML('afterbegin',aiPreviewBand('Заполнить из сообщения или файла','Текст, документы и голосовое сообщение. Результат можно будет проверить.','import','Посмотреть макет'));
 else if(!submit)dialogBody.insertAdjacentHTML('beforeend',`<div class="ai-preview-card-entry">${aiPreviewButton('Спросить ИИ об этой карточке','assistant',title)}</div>`);
};
const aiPreviewDrawBefore=drawDialog;
drawDialog=function(){
 aiPreviewDrawBefore();const body=$('#modal .dialogbody');
 if(body&&['order','job','trip','purchase'].includes(dialogType))body.insertAdjacentHTML('afterbegin',`<div class="ai-preview-card-entry">${aiPreviewButton('Спросить ИИ о связях и сроках','assistant',$('#modal h2')?.textContent||aiPreviewLocation())}</div>`);
 if(body&&dialogType==='neworder')body.insertAdjacentHTML('afterbegin',aiPreviewBand('Заявка из обращения клиента','Место для заполнения формы из сообщения или документа.','import','Посмотреть макет'));
};
const aiPreviewRenderBefore=render;
render=function(){if(aiPreviewDialog.open)aiPreviewDialog.close();aiPreviewRenderBefore();aiPreviewMount()};
render();

// Full-page companion to the contextual AI panel. UI state is kept in memory only.
const aiWorkspaceSessions=new Map();
function aiWorkspaceActive(){return page==='ai-assistant'||partnerKind()&&portalUI[partnerKind()==='client'?'clientTab':'supplierTab']==='assistant'}
function aiWorkspaceKey(){
 const role=aiPreviewRole();return role+':'+(role==='client'?portalUI.companyId:role==='supplier'?portalUI.supplierId:'team');
}
function aiWorkspaceSession(){
 const key=aiWorkspaceKey();if(!aiWorkspaceSessions.has(key))aiWorkspaceSessions.set(key,{selected:0,draft:'',context:''});
 return aiWorkspaceSessions.get(key);
}
function aiWorkspaceScope(){
 const role=aiPreviewRole();
 return role==='client'?portalCompany()?.name||'Компания клиента':role==='supplier'?portalSupplier(portalUI.supplierId)?.name||'Компания поставщика':role==='buyer'?'Снабжение предприятия':'Команда предприятия';
}
// Fixed examples of future interpretation, not NLP or a query over service data.
function aiWorkspaceUnderstanding(role,index){
 const scenarios={
  client:[
   {task:'Узнать готовность заказа и срок доставки.',subject:'Ваш заказ',period:'До получения заказа',clarify:'О каком заказе речь? Можно указать его номер в сообщении.'},
   {task:'Повторить прошлую закупку с более ранней доставкой.',subject:'Предыдущий заказ и доступные товары',period:'Желаемая дата получения',clarify:'Какой заказ повторить и к какой дате нужна доставка?'}
  ],
  supplier:[
   {task:'Найти ваши поставки без подтверждения покупателя.',subject:'Ваши заказы покупателя',period:'Текущие согласования'},
   {task:'Оценить перенос отгрузки и необходимость согласования.',subject:'Ваша отгрузка',period:'Понедельник — точную дату нужно уточнить',clarify:'Какую отгрузку переносим и какой понедельник вы имеете в виду?'}
  ],
  buyer:[
   {task:'Сравнить закупку пшеницы по полной стоимости.',subject:'Предложения пшеницы и условия доставки',period:'Актуальные предложения',clarify:'Какой объём нужен, куда и к какой дате доставить?'},
   {task:'Выявить задания, которым может не хватить сырья.',subject:'Остатки, потребность нарядов и поставка',period:'До ответа поставщика в понедельник',clarify:'О каком поставщике и сырье речь? Ответ в понедельник ещё не означает поставку в этот день.'}
  ],
  manager:[
   {task:'Проверить, хватит ли пшеницы на заказы в Юргу.',subject:'Пшеница и заказы с доставкой в Юргу',period:'До ожидаемого поступления сырья',clarify:'Когда ожидается поступление? Ответ поставщика в понедельник не определяет дату поставки.'},
   {task:'Оценить влияние переноса заказа на исполнение.',subject:'Заказ, связанные наряды и рейсы',period:'Новая дата исполнения',clarify:'Какой заказ и на какую дату переносим?'}
  ]
 };
 return scenarios[role]?.[index];
}
function aiWorkspaceContent(){
 const state=aiWorkspaceSession(),examples=aiPreviewExamples(),selected=state.selected===null?null:examples[state.selected];
 const role=aiPreviewRole(),understanding=selected?aiWorkspaceUnderstanding(role,state.selected):null;
 const narrow=matchMedia('(max-width:900px)').matches;
 const history=examples.map((x,i)=>({x,i})).filter(({x})=>[x.title,x.question].join(' ').toLocaleLowerCase('ru').includes(query.toLocaleLowerCase('ru')));
 return `<div class="ai-workspace-intro"><span class="ai-preview-eyebrow">${aiSpark} ИИ · макет рабочего раздела</span><p>Примеры показывают будущий вид анализа. ИИ и расчёты не подключены.</p></div><div class="ai-workspace-layout">
 <details class="ai-workspace-history" ${narrow?'':'open'}><summary>История диалогов</summary><div class="ai-workspace-history-body"><button type="button" class="ai-workspace-new" data-ai-workspace="new">${aiSpark} Новый диалог</button><span class="ai-preview-label">Демонстрационные диалоги</span><nav aria-label="История ИИ-диалогов">${history.map(({x,i})=>`<button type="button" data-ai-workspace="sample" data-ai-index="${i}" ${state.selected===i?'aria-current="true"':''}><strong>${esc(x.title)}</strong><span>Пример · ${esc(aiWorkspaceScope())}</span></button>`).join('')||'<p class="ai-workspace-muted">По вашему поиску диалогов нет.</p>'}</nav><p class="ai-workspace-history-note">История пока состоит из примеров. Сохранение переписки появится после подключения сервиса.</p></div></details>
 <section class="ai-workspace-conversation" aria-label="Диалог с ИИ-помощником"><header class="ai-workspace-conversation-head"><div><span class="ai-preview-label">${selected?'Демонстрационный диалог':'Новый диалог'}</span><h2>${esc(selected?.title||'Что хотите выяснить?')}</h2></div><span class="ai-workspace-role">${esc({client:'Клиент',supplier:'Поставщик',buyer:'Закупщик',manager:'Команда'}[role])}</span></header>
 <div class="ai-workspace-messages" aria-live="polite">${selected?`<div class="ai-workspace-user-message"><span>Ваш вопрос · пример</span><p>${esc(selected.question)}</p></div><article class="ai-workspace-answer"><div class="ai-workspace-answer-heading">${aiSpark}<strong>Помощник</strong><span>Пример ответа</span></div><p>${esc(selected.text)}</p>${understanding?.clarify?`<aside class="ai-workspace-clarification"><strong>Пример уточнения перед расчётом</strong><p>${esc(understanding.clarify)}</p></aside>`:''}<dl class="ai-workspace-result-metrics">${selected.metrics.map(([label,value])=>`<div><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl><section class="ai-workspace-evidence"><h3>${role==='buyer'?'Сравнение предложений':role==='manager'?'Связанные объекты и последствия':'Связанные заказы и поставки'}</h3><p>Место для подробной таблицы. Значения не рассчитаны.</p><div class="ai-workspace-table-wrap" tabindex="0" role="region" aria-label="Пример таблицы результата"><table><thead><tr><th>${role==='buyer'?'Предложение':'Объект'}</th><th>${role==='buyer'?'Стоимость с доставкой':'Состояние'}</th><th>${role==='buyer'?'Срок':'Следующее действие'}</th></tr></thead><tbody><tr><td>Будет найден</td><td>Не рассчитано</td><td>Нужно уточнить</td></tr></tbody></table></div></section><section class="ai-workspace-source-list"><h3>На чём будет основан ответ</h3><ul>${selected.sources.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><small>Источники показаны как пример; данные не запрашиваются.</small></section><div class="ai-workspace-answer-actions"><button type="button" disabled>${esc(selected.next)}</button><button type="button" disabled>Сохранить результат</button></div></article>`:`<section class="ai-workspace-welcome">${aiSpark}<h2>Задайте вопрос по данным сервиса</h2><p>Можно разобраться в сроках, сравнить условия или оценить последствия изменений.</p><div>${examples.map((x,i)=>`<button type="button" data-ai-workspace="sample" data-ai-index="${i}">${esc(x.question)}</button>`).join('')}</div></section>`}</div>
 <footer class="ai-workspace-composer"><label for="ai-workspace-question">Ваш вопрос</label><textarea id="ai-workspace-question" rows="3" placeholder="Опишите задачу своими словами">${esc(state.draft)}</textarea><div><span>Свободные вопросы пока не обрабатываются</span><button type="button" disabled>Отправить</button></div></footer></section>
 <details class="ai-workspace-context" ${narrow?'':'open'}><summary>Как помощник понял вопрос</summary><div class="ai-workspace-context-body"><div class="ai-workspace-context-scope"><span>Компания из текущего кабинета</span><strong>${esc(aiWorkspaceScope())}</strong></div>${state.context?`<div class="ai-workspace-entry"><span>Открыто из</span><p class="ai-workspace-context-name">${esc(state.context)}</p></div>`:''}${understanding?`<span class="ai-preview-label">Пример понимания вопроса</span><p class="ai-workspace-task">${esc(understanding.task)}</p><dl class="ai-workspace-understanding"><div><dt>О чём речь</dt><dd>${esc(understanding.subject)}</dd></div><div><dt>Какие сроки важны</dt><dd>${esc(understanding.period)}</dd></div></dl>`:'<p class="ai-workspace-muted">Объекты и сроки будут определяться из вашего вопроса и переписки.</p>'}<small>Если помощник понял вас неверно, уточните обычным сообщением. При неоднозначности он задаст вопрос.</small><div class="ai-workspace-access-note">${role==='client'?'Только ваши заявки, заказы и условия.':role==='supplier'?'Только ваши предложения, заказы и отгрузки.':'Доступ к данным определяется правами сотрудника.'}</div></div></details></div>`;
}
function aiWorkspaceOpen(context='',fromPanel=false){
 const role=aiPreviewRole(),sample=aiPreviewSample;
 if(aiPreviewDialog.open)aiPreviewDialog.close();if(portalDialog.open)portalDialog.close();if($('#modal').open)$('#modal').close();
 closeControlPopup();closeNavFlyout();query='';
 if(role==='client'||role==='supplier')portalUI[role==='client'?'clientTab':'supplierTab']='assistant';
 else{aiAssistantInternalRole=role==='buyer'?'buyer':'manager';page='ai-assistant'}
 const state=aiWorkspaceSession();if(context)state.context=context;if(fromPanel)state.selected=sample;
 render();const title=partnerKind()?partnerRoot.querySelector('.partner-page-head h1'):$('#app .page-heading h1');
 if(title){title.tabIndex=-1;title.focus({preventScroll:true})}
}
const aiWorkspaceClientBefore=partnerClientContent;
partnerClientContent=function(){return portalUI.clientTab==='assistant'?aiWorkspaceContent():aiWorkspaceClientBefore()};
const aiWorkspaceSupplierBefore=partnerSupplierContent;
partnerSupplierContent=function(){return portalUI.supplierTab==='assistant'?aiWorkspaceContent():aiWorkspaceSupplierBefore()};
const aiWorkspaceViewBefore=view;
view=function(){return page==='ai-assistant'?aiWorkspaceContent():aiWorkspaceViewBefore()};

// A direct entry in the expanded menu and the collapsed navigation rail.
const aiWorkspaceNav=document.createElement('nav');aiWorkspaceNav.className='nav ai-workspace-navigation';aiWorkspaceNav.setAttribute('aria-label','ИИ-помощник');
aiWorkspaceNav.innerHTML=`<button type="button" data-ai-workspace="open">${aiSpark}<span>ИИ-помощник</span></button>`;sidebarStats.before(aiWorkspaceNav);
navRail.insertAdjacentHTML('beforeend',`<button type="button" data-ai-workspace="open" aria-label="ИИ-помощник" title="ИИ-помощник">${aiSpark}<span class="rail-marker" aria-hidden="true"></span></button>`);

// Keep quick questions in the drawer, with a continuation on the full page.
const aiWorkspacePanelBefore=aiPreviewAssistantBody;
aiPreviewAssistantBody=function(){return aiWorkspacePanelBefore().replace('<footer class="ai-preview-composer">',`<footer class="ai-preview-composer"><button type="button" class="ai-workspace-expand" data-ai-workspace="expand">Открыть полный раздел</button>`)};
function aiWorkspaceDecorate(){
 const active=!!aiWorkspaceActive();document.body.classList.toggle('ai-workspace-mode',active);
 document.querySelectorAll('.sidebar [data-ai-workspace="open"]').forEach(b=>{b.classList.toggle('active',page==='ai-assistant');if(page==='ai-assistant')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(!active)return;
 if(partnerKind()){
  const head=partnerRoot.querySelector('.partner-page-head');head.querySelector('p').textContent='Диалоги, расчёты и связанные данные';head.querySelectorAll('button').forEach(b=>b.remove());
  const search=partnerRoot.querySelector('#partner-search');search.placeholder='Поиск по диалогам';search.setAttribute('aria-label','Поиск по диалогам');
 }else{
  $('#crumb').textContent='ИИ-помощник';
  const head=$('#app .page-heading');if(head){
   const note=head.querySelector('p'),eyebrow=head.querySelector('.eyebrow');
   if(note)note.textContent='Диалоги, расчёты и связанные данные';
   else head.querySelector('h1')?.insertAdjacentHTML('afterend','<p>Диалоги, расчёты и связанные данные</p>');
   if(eyebrow)eyebrow.textContent='Помощник по данным сервиса';
  }
  const search=$('#search');if(search){search.placeholder='Поиск по диалогам';search.setAttribute('aria-label','Поиск по диалогам')}
 }
}
document.addEventListener('click',event=>{
 const control=event.target.closest('[data-ai-workspace]');if(!control)return;event.preventDefault();const action=control.dataset.aiWorkspace;
 if(action==='open')return aiWorkspaceOpen();
 if(action==='expand')return aiWorkspaceOpen(aiPreviewContext,true);
 if(!aiWorkspaceActive())return;
 const state=aiWorkspaceSession();
 if(action==='new'){state.selected=null;state.draft='';state.context='';query='';render();$('#ai-workspace-question').focus()}
 if(action==='sample'){
  state.selected=Number(control.dataset.aiIndex);state.draft='';state.context='';render();
  const button=document.querySelector(`.ai-workspace-history [data-ai-index="${state.selected}"]`);
  if(button&&button.getClientRects().length)button.focus({preventScroll:true});
  else{const title=document.querySelector('.ai-workspace-conversation-head h2');title.tabIndex=-1;title.focus({preventScroll:true})}
 }
});
document.addEventListener('input',event=>{if(event.target.id==='ai-workspace-question')aiWorkspaceSession().draft=event.target.value});
const aiWorkspaceRenderBefore=render;
render=function(){aiWorkspaceRenderBefore();aiWorkspaceDecorate()};
render();
</script></body></html>
